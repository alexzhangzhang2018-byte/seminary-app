<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>内部考试 · 教师端</title>
<script src="/vendor/supabase.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#f8fafc;color:#1e293b;font-size:14px}
button,input,textarea,select{font:inherit}
a{color:#4f46e5}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px 48px}
.hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.hdr h1{font-size:18px;font-weight:800}
.tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.tab{padding:8px 14px;border-radius:10px;border:1px solid #e2e8f0;background:#fff;cursor:pointer;font-weight:600}
.tab.on{background:#4f46e5;color:#fff;border-color:#4f46e5}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:18px;margin-bottom:14px}
.card h2{font-size:15px;font-weight:800;margin-bottom:12px}
.inp,.sel,.textarea{width:100%;border:1px solid #e2e8f0;border-radius:8px;padding:8px 10px;margin-bottom:8px}
.textarea{min-height:160px;font-family:ui-monospace,monospace;font-size:12px}
.btn{padding:9px 16px;border-radius:10px;border:none;font-weight:700;cursor:pointer;background:#4f46e5;color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-o{background:#fff;color:#4f46e5;border:1px solid #c7d2fe}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 10px;border-bottom:1px solid #f1f5f9;text-align:left}
th{font-size:11px;color:#64748b;text-transform:uppercase}
tr.sel{background:#eef2ff;cursor:pointer}
tr.sel.on{background:#dbeafe;box-shadow:inset 3px 0 0 #4f46e5}
tr.grade-expand td{padding:0;background:#f8fafc;border-bottom:2px solid #c7d2fe;vertical-align:top}
.grade-inline{padding:14px 16px 18px}
.grade-nav{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.grade-inline .card{margin:0;border:none;box-shadow:none;padding:0;background:transparent}
.grade-inline h2{font-size:15px;margin-bottom:8px}
.ocr-card{border:1px dashed #c7d2fe;border-radius:12px;padding:14px;margin:12px 0 16px;background:#fafbff}
.ocr-card .textarea{min-height:120px;font-size:13px;margin-top:8px}
.answer-edit{min-height:140px;font-size:13px;margin:8px 0 10px}
.obj-panel{margin-top:10px}
.tag{font-size:11px;padding:3px 8px;border-radius:999px;font-weight:700}
.tag-pending{background:#fef3c7;color:#92400e}
.tag-done{background:#dcfce7;color:#15803d}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:800px){.grid2{grid-template-columns:1fr}}
.grade-box{border:1px solid #e2e8f0;border-radius:10px;padding:14px;margin-bottom:12px}
.grade-box.obj-ok{border-color:#86efac;background:#f0fdf4}
.grade-box.obj-part{border-color:#fde68a;background:#fffbeb}
.grade-box.obj-miss{border-color:#fecaca;background:#fef2f2}
.grade-sec{margin:18px 0 10px;font-size:13px;font-weight:800;color:#475569}
.grade-sec:first-child{margin-top:0}
.obj-score{font-weight:800;font-size:13px}
.obj-score.ok{color:#15803d}
.obj-score.part{color:#b45309}
.obj-score.miss{color:#b91c1c}
.grade-score-row{display:flex;align-items:center;gap:10px;margin:12px 0 0}
.grade-score-row label{font-weight:700;font-size:14px;white-space:nowrap}
.grade-score-inp{width:72px;padding:8px 6px;font-size:26px;font-weight:800;text-align:center;border:1px solid #cbd5e1;border-radius:8px;margin:0;background:#fff}
.btn-sm{padding:4px 10px;font-size:12px;border-radius:8px}
.muted{color:#64748b;font-size:12px}
.btn-danger{background:#dc2626;color:#fff}
.btn-danger:hover{background:#b91c1c}
.admin-warn{background:#fef2f2;border:1px solid #fecaca;border-radius:10px;padding:12px;margin-bottom:12px;color:#991b1b;font-size:13px;line-height:1.6}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 14px;border-radius:10px;opacity:0;transition:.2s;z-index:9}
.toast.show{opacity:1}
.lang-tags{display:flex;gap:4px;flex-wrap:wrap}
.lang-tag{font-size:11px;padding:2px 7px;border-radius:6px;font-weight:700;white-space:nowrap}
.lang-tag.lang-on{background:#dcfce7;color:#15803d;border:1px solid #86efac}
.lang-tag.lang-off{background:#f1f5f9;color:#94a3b8;border:1px solid #e2e8f0;text-decoration:line-through}
.track-chks{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;padding:8px 0 4px}
.track-chks label{display:inline-flex;align-items:center;gap:6px;font-size:13px;cursor:pointer;white-space:nowrap}
.track-chks input{width:16px;height:16px;margin:0}
.track-chk-actions{margin-top:4px}
</style>
</head>
<body>
<div class="wrap">
  <div class="hdr">
    <h1>内部考试 · 教师端</h1>
    <div id="auth-area"></div>
  </div>
  <div id="login-panel" class="card" style="max-width:400px">
    <h2>教务登录</h2>
    <input class="inp" id="login-email" type="email" placeholder="邮箱">
    <input class="inp" id="login-pw" type="password" placeholder="密码">
    <button class="btn" id="btn-login">登录</button>
    <p class="muted" style="margin-top:10px">使用招生系统同一教务账号（admin / teacher）</p>
  </div>
  <div id="main-panel" style="display:none">
    <div class="tabs">
      <button class="tab on" data-tab="grades">成绩</button>
      <button class="tab" data-tab="papers">题库/试卷</button>
      <button class="tab" data-tab="days">考试日</button>
      <button class="tab" data-tab="admin">考试管理</button>
    </div>
    <div id="tab-grades"></div>
    <div id="tab-papers" style="display:none"></div>
    <div id="tab-days" style="display:none"></div>
    <div id="tab-admin" style="display:none"></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
(function teacherLoginBoot() {
  var SB_URL = 'https://szjduusewnjxacrbbsdf.supabase.co';
  var SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN6amR1dXNld25qeGFjcmJic2RmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ4NjMxNjEsImV4cCI6MjA5MDQzOTE2MX0.7Cg_uOp2Q2wtKaZqVnYdMLvnZJEyh6GyE26xXb-UTBw';
  function toastBoot(msg) {
    var t = document.getElementById('toast');
    if (!t) { alert(msg); return; }
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(function () { t.classList.remove('show'); }, String(msg).length > 36 ? 5500 : 2800);
  }
  function authErrBoot(err) {
    var raw = String((err && err.message) || err || '');
    var low = raw.toLowerCase();
    if (low.indexOf('email not confirmed') >= 0) return '该邮箱尚未验证，请在 Supabase 中将用户标为已确认。';
    if (low.indexOf('invalid login') >= 0 || low.indexOf('invalid_grant') >= 0 || low.indexOf('invalid credentials') >= 0) {
      return '邮箱或密码不正确（与招生系统同一账号）。';
    }
    if (low.indexOf('fetch') >= 0 || low.indexOf('network') >= 0 || low.indexOf('timeout') >= 0 || low.indexOf('abort') >= 0) {
      return '网络超时，请换网络或稍后重试。';
    }
    return raw || '登录失败';
  }
  function withTimeoutBoot(p, ms) {
    return Promise.race([
      p,
      new Promise(function (_, rej) { setTimeout(function () { rej(new Error('timeout')); }, ms); }),
    ]);
  }
  async function doLogin() {
    if (typeof supabase === 'undefined') {
      toastBoot('Supabase 未加载：请刷新页面，勿用 WhatsApp 内置浏览器。');
      return;
    }
    var email = (document.getElementById('login-email').value || '').trim();
    var pw = document.getElementById('login-pw').value || '';
    if (!email || !pw) { toastBoot('请填写邮箱和密码'); return; }
    var btn = document.getElementById('btn-login');
    var prev = btn.textContent;
    btn.disabled = true;
    btn.textContent = '登录中…';
    try {
      var sb = supabase.createClient(SB_URL, SB_KEY);
      var res = await withTimeoutBoot(sb.auth.signInWithPassword({ email: email, password: pw }), 35000);
      if (res.error) { toastBoot(authErrBoot(res.error)); return; }
      var profRes = await withTimeoutBoot(
        sb.from('profiles').select('*').eq('id', res.data.user.id).single(),
        20000,
      );
      if (profRes.error || !profRes.data) {
        toastBoot('登录成功，但未找到教务档案（profiles）。');
        await sb.auth.signOut();
        return;
      }
      if (['admin', 'teacher'].indexOf(profRes.data.role) < 0) {
        toastBoot('无权限（角色：' + (profRes.data.role || '未知') + '）');
        await sb.auth.signOut();
        return;
      }
      if (typeof window.__teacherEnterApp === 'function') {
        await window.__teacherEnterApp(res.data.user, profRes.data, email);
      } else {
        window.__pendingTeacherLogin = { user: res.data.user, profile: profRes.data, email: email };
        toastBoot('主程序仍在加载，请 2 秒后重试；若仍失败请强制刷新并更新 student-exam/shared.js');
      }
    } catch (e) {
      toastBoot(authErrBoot(e));
    } finally {
      btn.disabled = false;
      btn.textContent = prev;
    }
  }
  document.getElementById('btn-login').addEventListener('click', doLogin);
  document.getElementById('login-pw').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') doLogin();
  });
  document.getElementById('login-email').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') document.getElementById('login-pw').focus();
  });
})();
</script>
<script type="module">
(async function teacherAppMain() {
let createSb, esc, trackLabel, teacherPaperTitle,
  paperLocaleBadgesHtml, paperLocaleSummary, paperLocaleCodes, withTimeout,
  isObjectiveType, paperHasObjective, isAllSubjectivePaper,
  questionLocale, gradeOneQuestion, formatStudentAnswer, formatCorrectAnswer,
  mergeGradingItems;
let docxFileToSnapshot, mergeSnapshotsByIndex;
function escBoot(s) {
  return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
try {
  const mod = await import('./shared.js?v=202606171400');
  ({
    createSb, esc, trackLabel, teacherPaperTitle,
    paperLocaleBadgesHtml, paperLocaleSummary, paperLocaleCodes, withTimeout,
    isObjectiveType, paperHasObjective, isAllSubjectivePaper,
    questionLocale, gradeOneQuestion, formatStudentAnswer, formatCorrectAnswer,
    mergeGradingItems,
  } = mod);
  const docxMod = await import('./docx-import.js');
  docxFileToSnapshot = docxMod.docxFileToSnapshot;
  mergeSnapshotsByIndex = docxMod.mergeSnapshotsByIndex;
} catch (e) {
  const panel = document.getElementById('login-panel');
  if (panel && !document.getElementById('js-fatal')) {
    panel.insertAdjacentHTML('beforeend',
      '<p id="js-fatal" class="admin-warn" style="margin-top:12px">页面脚本加载失败：'
      + escBoot(String(e.message || e))
      + '。请将 <strong>student-exam/shared.js</strong> 与 teacher.html 一并部署到 Vercel 后强制刷新。</p>');
  }
  console.error('teacher module load', e);
  return;
}

function trackLabelZh(track) {
  return trackLabel(track, 'zh');
}

const sb = createSb();
if (!sb) {
  document.getElementById('login-panel').insertAdjacentHTML('beforeend',
    '<p class="admin-warn" style="margin-top:12px">无法加载 Supabase（/vendor/supabase.js）。请刷新或换网络；若从 WhatsApp 内打开请改用 Chrome/Safari。</p>');
}
const S = {
  user: null,
  profile: null,
  tab: 'grades',
  days: [],
  papers: [],
  subjects: [],
  selectedDayId: null,
  selectedSubjectId: null,
  attempts: [],
  expandedAttemptId: null,
  gradingAttempt: null,
  gradingLoading: false,
  showObjective: false,
};

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  const ms = String(msg).length > 40 ? 5500 : 2800;
  setTimeout(() => t.classList.remove('show'), ms);
}

function dayErrorText(code) {
  const map = {
    forbidden: '无权限',
    day_not_found: '考试日不存在',
    day_not_closed: '考试日不存在或已删除',
    date_exists: '该日期已有考试日',
  };
  return map[code] || code;
}

function messageForStaffAuthError(err) {
  const raw = String(err?.message || err || '');
  const low = raw.toLowerCase();
  const code = String(err?.code || '');
  if (low.includes('email not confirmed') || code === 'email_not_confirmed') {
    return '该邮箱尚未验证：请在 Supabase → Authentication 中将该用户标为已确认（Confirm email）。';
  }
  if (low.includes('too many request') || code === 'over_request_rate_limit') {
    return '尝试过于频繁，请几分钟后再试。';
  }
  if (low.includes('invalid login') || low.includes('invalid_grant') || low.includes('invalid credentials')) {
    return '邮箱或密码不正确。若尚未开通：请管理员在 Supabase → Authentication 添加用户；初始密码常用 392766。';
  }
  if (low.includes('fetch') || low.includes('network') || low.includes('failed to fetch') || low.includes('timeout') || low.includes('abort')) {
    return '网络连接超时，请检查网络后刷新重试（考试日高峰期 Supabase 可能较慢）。';
  }
  return raw || '登录失败';
}

async function enterApp(user, prof, email) {
  if (!sb) { toast('系统未就绪：Supabase 未加载'); return; }
  S.user = user;
  S.profile = prof;
  document.getElementById('login-panel').style.display = 'none';
  document.getElementById('main-panel').style.display = 'block';
  document.getElementById('auth-area').innerHTML = `<span class="muted">${esc(prof.display_name || email || user.email)}</span> <button class="btn-o btn" id="btn-logout" style="margin-left:8px;padding:6px 12px">退出</button>`;
  document.getElementById('btn-logout').onclick = async () => {
    await sb.auth.signOut();
    location.reload();
  };
  await loadAll();
}
window.__teacherEnterApp = enterApp;

async function loadAll() {
  const [d, p] = await Promise.all([
    sb.rpc('staff_student_exam_list_days'),
    sb.rpc('staff_student_exam_list_papers'),
  ]);
  S.days = d.data?.days || [];
  if (p.error) {
    console.warn('list_papers', p.error);
    toast('加载试卷失败：' + (p.error.message || '请确认已执行数据库迁移'));
  }
  S.papers = p.data?.papers || [];
  if (!S.papers.length) {
    const { data: rows } = await sb.from('student_exam_papers')
      .select('id,title,grade,status,total_score,snapshot_json,title_locales,course_code')
      .order('updated_at', { ascending: false });
    if (rows?.length) S.papers = rows;
  }
  if (!S.selectedDayId && S.days[0]) S.selectedDayId = S.days[0].id;
  await loadSubjectsForDay();
  render();
}

async function loadSubjectsForDay() {
  S.subjects = [];
  if (!S.selectedDayId) return;
  const { data } = await sb.from('student_exam_day_subjects')
    .select('id,subject_name,grade,class_track,start_at,end_at,sort_order,paper_id')
    .eq('exam_day_id', S.selectedDayId)
    .order('sort_order');
  S.subjects = data || [];
  if (!S.selectedSubjectId && S.subjects[0]) S.selectedSubjectId = S.subjects[0].id;
  if (S.selectedSubjectId) await loadAttempts();
}

async function loadAttempts() {
  if (!S.selectedSubjectId) { S.attempts = []; return; }
  const { data } = await sb.rpc('staff_student_exam_list_attempts', { p_day_subject_id: S.selectedSubjectId });
  S.attempts = data?.attempts || [];
}

function gradingStatusLabel(status) {
  if (status === 'done') return '已阅';
  if (status === 'partial') return '阅卷中';
  if (status === 'none') return '机评';
  return '待阅';
}

function gradingStatusClass(status) {
  if (status === 'done' || status === 'none') return 'tag-done';
  return 'tag-pending';
}

function clearStudentErrorText(err) {
  if (err === 'forbidden') return '无权限';
  if (err === 'full_name_required') return '请填写姓名';
  if (err === 'phone_last4_required') return '手机后四位须为 4 位数字';
  if (err === 'not_found') return '未找到该考生记录';
  return err || '操作失败';
}

async function deleteStudentRecord({ checkInId, examDayId, fullName, phoneLast4 }) {
  if (checkInId) {
    const byId = await sb.rpc('staff_student_exam_delete_check_in', { p_check_in_id: checkInId });
    if (byId.data?.ok) return byId;
    const missing = byId.error?.message?.includes('Could not find') || byId.error?.message?.includes('does not exist');
    if (!missing) return byId;
  }
  return sb.rpc('staff_student_exam_clear_check_in', {
    p_exam_day_id: examDayId,
    p_full_name: fullName,
    p_phone_last4: phoneLast4 || null,
  });
}

function subjectNameFlags(name) {
  const n = String(name || '');
  return {
    allSubjective: /启示录|撒母耳|revelation|samuel|wahyu/i.test(n),
    allowAnswerEdit: /撒母耳|samuel/i.test(n),
    allowPaperOcr: /启示录|revelation|wahyu/i.test(n),
  };
}

function currentSubjectFlags() {
  const subj = S.subjects.find((s) => s.id === S.selectedSubjectId);
  return subjectNameFlags(subj?.subject_name);
}

let tesseractLoadPromise = null;
function loadTesseract() {
  if (window.Tesseract) return Promise.resolve();
  if (!tesseractLoadPromise) {
    tesseractLoadPromise = new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
      s.onload = resolve;
      s.onerror = () => reject(new Error('tesseract_load_fail'));
      document.head.appendChild(s);
    });
  }
  return tesseractLoadPromise;
}

function applyOcrSplitToForm(raw, paper) {
  const essays = (paper || []).filter((q) => q.type === 'essay')
    .sort((a, b) => (a.sort_order || 0) - (b.sort_order || 0));
  if (!essays.length) return 0;
  const text = String(raw || '').trim();
  if (!text) return 0;
  let chunks = text.split(/\n(?=\s*(?:第?\s*[0-9一二三四五六七八九十]+[\s\.、\)）]|（[0-9]+）|\([0-9]+\)))/);
  if (chunks.length <= 1) chunks = text.split(/\n{2,}/).filter((c) => c.trim());
  let n = 0;
  essays.forEach((q, i) => {
    const ta = document.querySelector(`[data-answer-edit][data-gid="${q.group_id}"]`);
    const chunk = (chunks[i] || (i === 0 && chunks.length === 1 ? text : '')).trim();
    if (!ta || !chunk) return;
    ta.value = chunk.replace(/^(?:第?\s*)?[0-9一二三四五六七八九十]+[\s\.、\)）]\s*/, '').trim();
    n++;
  });
  return n;
}

function renderGrades() {
  const dayOpts = S.days.map((d) =>
    `<option value="${d.id}"${d.id === S.selectedDayId ? ' selected' : ''}>${esc(d.title)} (${d.exam_date})</option>`
  ).join('');
  const subOpts = S.subjects.map((s) =>
    `<option value="${s.id}"${s.id === S.selectedSubjectId ? ' selected' : ''}>${esc(s.subject_name)} · ${s.grade}年级 · ${esc(trackLabelZh(s.class_track))}</option>`
  ).join('');
  const subj = S.subjects.find((s) => s.id === S.selectedSubjectId);
  const allSubjSubject = subj && /启示录|撒母耳|revelation|samuel|wahyu/i.test(subj.subject_name || '');
  const rows = S.attempts.flatMap((a) => {
    const gs = gradingStatusClass(a.grading_status);
    const gt = allSubjSubject && a.grading_status === 'none' ? '待阅' : gradingStatusLabel(a.grading_status);
    const objCol = allSubjSubject ? '—' : (a.objective_score ?? '—');
    const isOn = a.id === S.expandedAttemptId;
    const head = `<tr class="sel${isOn ? ' on' : ''}" data-aid="${a.id}">
      <td>${esc(a.display_name)}</td>
      <td>${a.grade}</td>
      <td>${esc(trackLabelZh(a.class_track))}</td>
      <td>${esc(a.exam_lang)}</td>
      <td>${objCol}</td>
      <td>${a.subjective_score ?? '—'}</td>
      <td><strong>${a.total_score ?? '—'}</strong></td>
      <td><span class="tag ${gs}">${gt}</span></td>
      <td>${a.proctor_flags || 0}</td>
    </tr>`;
    if (!isOn) return [head];
    const panel = S.gradingLoading
      ? '<p class="muted">加载答卷中…</p>'
      : (S.gradingAttempt?.attempt?.id === a.id ? buildGradingPanelHtml(S.gradingAttempt, a.id) : '<p class="muted">加载答卷中…</p>');
    return [head, `<tr class="grade-expand" data-expand-for="${a.id}"><td colspan="9"><div class="grade-inline">${panel}</div></td></tr>`];
  }).join('');

  document.getElementById('tab-grades').innerHTML = `
    <div class="card">
      <h2>成绩列表</h2>
      <div class="grid2">
        <select class="sel" id="sel-day">${dayOpts || '<option>暂无考试日</option>'}</select>
        <select class="sel" id="sel-subject">${subOpts || '<option>暂无科目</option>'}</select>
      </div>
      <button class="btn btn-o" id="btn-export-csv" style="margin:8px 0">导出 CSV</button>
      <table>
        <thead><tr>
          <th>姓名</th><th>年级</th><th>班级</th><th>语言</th><th>客观</th><th>主观</th><th>总分</th><th>阅卷</th><th>切屏</th>
        </tr></thead>
        <tbody>${rows || '<tr><td colspan="9" class="muted">暂无答卷</td></tr>'}</tbody>
      </table>
    </div>`;

  document.getElementById('sel-day')?.addEventListener('change', async (e) => {
    S.selectedDayId = e.target.value;
    S.selectedSubjectId = null;
    S.expandedAttemptId = null;
    S.gradingAttempt = null;
    await loadSubjectsForDay();
    render();
  });
  document.getElementById('sel-subject')?.addEventListener('change', async (e) => {
    S.selectedSubjectId = e.target.value;
    S.expandedAttemptId = null;
    S.gradingAttempt = null;
    await loadAttempts();
    render();
  });
  document.querySelectorAll('tr.sel[data-aid]').forEach((tr) => {
    tr.addEventListener('click', () => openGrading(tr.dataset.aid));
  });
  if (S.expandedAttemptId) bindGradePanelEvents(S.expandedAttemptId);
  document.getElementById('btn-export-csv')?.addEventListener('click', exportCsv);
}

function scrollToExpanded(attemptId) {
  requestAnimationFrame(() => {

    row?.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

function buildGradingPanelHtml(data, attemptId) {
  const paper = Array.isArray(data.paper) ? data.paper : [];
  const lang = data.check_in?.exam_lang || 'zh';
  const answers = data.attempt?.answers_json || {};
  const flags = currentSubjectFlags();
  const canEditAnswers = flags.allowAnswerEdit || flags.allowPaperOcr;
  const allSubjective = isAllSubjectivePaper(paper);
  const hasObjective = paperHasObjective(paper);
  const subjectiveItems = mergeGradingItems(paper, answers, data.grading_items || []);

  if (!subjectiveItems.length && !hasObjective) {
    return '<p class="muted">该答卷暂无题目数据</p>';
  }

  const objectiveBlocks = hasObjective
    ? paper
      .filter((q) => isObjectiveType(q.type))
      .sort((a, b) => (a.sort_order || 0) - (b.sort_order || 0))
      .map((q) => {
        const loc = questionLocale(q, lang);
        const userAns = answers[q.group_id];
        const earned = gradeOneQuestion(q.type, q.score, userAns, loc.answer_key, lang);
        const max = Number(q.score) || 0;
        const cls = earned >= max - 0.001 ? 'obj-ok' : earned > 0 ? 'obj-part' : 'obj-miss';
        const scoreCls = earned >= max - 0.001 ? 'ok' : earned > 0 ? 'part' : 'miss';
        return `<div class="grade-box ${cls}">
          <div class="muted">第 ${q.sort_order} 题 · 客观题 · 满分 ${max}</div>
          <div style="margin:8px 0;font-weight:600;white-space:pre-wrap">${esc(loc.stem || '')}</div>
          <div class="muted">标准答案：</div>
          <div style="white-space:pre-wrap;margin:6px 0 10px;padding:10px;background:#fffbeb;border:1px solid #fde68a;border-radius:8px;font-size:13px">${esc(formatCorrectAnswer(q, lang))}</div>
          <div class="muted">学生作答：</div>
          <div style="white-space:pre-wrap;margin:6px 0 10px;padding:10px;background:#f8fafc;border-radius:8px">${esc(formatStudentAnswer(q, userAns, lang))}</div>
          <div class="obj-score ${scoreCls}">机评得分：${earned} / ${max}</div>
        </div>`;
      }).join('')
    : '';

  const subjectiveBlocks = subjectiveItems.map((gi) => {
    const q = paper.find((x) => x.group_id === gi.group_id);
    const loc = questionLocale(q, lang);
    const ref = loc.answer_key?.reference;
    const ansText = gi.answer_text || answers[gi.group_id] || '';
    const answerHtml = canEditAnswers
      ? `<textarea class="textarea answer-edit" data-answer-edit data-gid="${esc(gi.group_id)}" rows="8">${esc(ansText)}</textarea>`
      : `<div style="white-space:pre-wrap;margin:6px 0 10px;padding:10px;background:#f8fafc;border-radius:8px">${esc(ansText || '（未作答）')}</div>`;
    return `<div class="grade-box" data-gid="${esc(gi.group_id)}">
      <div class="muted">第 ${gi.sort_order} 题 · 主观题 · 满分 ${gi.max_score}</div>
      <div style="margin:8px 0;font-weight:600;white-space:pre-wrap">${esc(loc.stem || '')}</div>
      ${ref ? `<div class="muted">参考答案：</div>
      <div style="white-space:pre-wrap;margin:6px 0 10px;padding:10px;background:#fffbeb;border:1px solid #fde68a;border-radius:8px;font-size:13px">${esc(ref)}</div>` : ''}
      <div class="muted">学生作答${canEditAnswers ? '（可编辑补录）' : ''}：</div>
      ${answerHtml}
      <div class="grade-score-row">
        <label for="score-${esc(gi.group_id)}">得分</label>
        <input class="grade-score-inp" id="score-${esc(gi.group_id)}" type="number" min="0" max="${gi.max_score}" step="0.5" data-score value="${gi.score ?? ''}" inputmode="decimal">
        <span class="muted">/ ${gi.max_score} 分</span>
      </div>
    </div>`;
  }).join('');

  const summary = allSubjective
    ? `<p class="muted">全主观题试卷 · 请逐题评分${canEditAnswers ? '（可先补录学生作答）' : ''}</p>`
    : hasObjective
      ? `<p class="muted">客观题已机评（${data.attempt.objective_score ?? 0} 分）· 主观题请教师评分</p>`
      : `<p class="muted">客观分：${data.attempt.objective_score ?? '—'}</p>`;

  const idx = S.attempts.findIndex((x) => x.id === attemptId);
  const nav = `<div class="grade-nav">
    <button type="button" class="btn btn-o btn-sm" id="btn-grade-prev"${idx <= 0 ? ' disabled' : ''}>↑ 上一份</button>
    <button type="button" class="btn btn-o btn-sm" id="btn-grade-next"${idx >= S.attempts.length - 1 ? ' disabled' : ''}>下一份 ↓</button>
    <button type="button" class="btn btn-danger btn-sm" id="btn-delete-student" style="margin-left:auto">删除该学员今日全部记录</button>
  </div>`;

  const ci = data.check_in || {};
  const ciMeta = [
    ci.internal_no ? `学号 ${ci.internal_no}` : '',
    ci.full_name ? `签到 ${ci.full_name}` : '',
    ci.phone_last4 ? `尾号 ${ci.phone_last4}` : '',
    ci.grade ? `${ci.grade}年级` : '',
    ci.class_track ? trackLabelZh(ci.class_track) : '',
  ].filter(Boolean).join(' · ');

  const ocrBlock = flags.allowPaperOcr ? `
    <div class="ocr-card">
      <h3>📷 纸质答卷 · 拍照识别</h3>
      <p class="muted">上传答卷照片，自动识别文字后填入下方各题。识别结果请核对修改，再点「保存补录答案」。</p>
      <input type="file" id="ocr-files" accept="image/*" multiple>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">
        <button type="button" class="btn btn-o btn-sm" id="btn-ocr-run">识别选中图片</button>
        <button type="button" class="btn btn-o btn-sm" id="btn-ocr-split">按题号填入各题</button>
      </div>
      <textarea class="textarea" id="ocr-raw" placeholder="识别出的全文将显示在这里，可手工修改后再填入各题…"></textarea>
    </div>` : '';

  const objectiveSection = hasObjective ? `
    <div class="obj-collapsed">
      <button type="button" class="btn btn-o btn-sm" id="btn-toggle-obj">
        ${S.showObjective ? '收起客观题' : `查看客观题（机评 ${data.attempt.objective_score ?? 0} 分）`}
      </button>
      <div class="obj-panel" id="obj-panel" style="display:${S.showObjective ? 'block' : 'none'}">
        <div class="grade-sec">客观题（系统机评，仅供查阅）</div>
        ${objectiveBlocks}
      </div>
    </div>` : '';

  const saveAnswersBtn = canEditAnswers
    ? '<button type="button" class="btn btn-o" id="btn-save-answers" style="margin-right:8px">保存补录答案</button>'
    : '';

  return `
    <div class="card" data-grade-panel="${attemptId}">
      ${nav}
      <h2>阅卷 · ${esc(data.attempt.display_name)}</h2>
      <p class="muted">${esc(ciMeta)}</p>
      ${flags.allowAnswerEdit ? '<p class="muted" style="margin-bottom:8px">系统故障导致答案未保存时，可在下方逐题补录学生手写/口述内容，保存后再评分。</p>' : ''}
      ${summary}
      ${ocrBlock}
      ${objectiveSection}
      ${subjectiveItems.length ? `<div class="grade-sec">${hasObjective ? '主观题（教师评分）' : '主观题作答'}</div>${subjectiveBlocks}` : ''}
      <div style="margin-top:12px;display:flex;flex-wrap:wrap;gap:8px">
        ${saveAnswersBtn}
        ${subjectiveItems.length ? '<button type="button" class="btn" id="btn-save-grade">保存主观题评分</button>' : ''}
      </div>
    </div>`;
}

function collectAnswerEdits(attemptId) {
  const out = {};
  document.querySelectorAll(`tr[data-expand-for="${attemptId}"] [data-answer-edit]`).forEach((el) => {
    if (el.dataset.gid) out[el.dataset.gid] = el.value;
  });
  return out;
}

async function saveAnswerEdits(attemptId) {
  const answers = collectAnswerEdits(attemptId);
  if (!Object.keys(answers).length) { toast('没有可保存的答案'); return false; }
  const res = await sb.rpc('staff_student_exam_update_answers', {
    p_attempt_id: attemptId,
    p_answers: answers,
    p_mark_submitted: true,
  });
  if (res.data?.ok) {
    toast('补录答案已保存');
    await loadAttempts();
    return true;
  }
  const err = res.data?.error || res.error?.message || '保存失败';
  if (err.includes('Could not find') || err.includes('does not exist')) {
    toast('请先在 Supabase 执行迁移 20260616130000_student_exam_staff_update_answers.sql');
  } else {
    toast(err);
  }
  return false;
}

function bindGradePanelEvents(attemptId) {
  const idx = S.attempts.findIndex((x) => x.id === attemptId);
  document.getElementById('btn-grade-prev')?.addEventListener('click', (e) => {
    e.stopPropagation();
    if (idx > 0) openGrading(S.attempts[idx - 1].id);
  });
  document.getElementById('btn-grade-next')?.addEventListener('click', (e) => {
    e.stopPropagation();
    if (idx < S.attempts.length - 1) openGrading(S.attempts[idx + 1].id);
  });
  document.getElementById('btn-toggle-obj')?.addEventListener('click', (e) => {
    e.stopPropagation();
    S.showObjective = !S.showObjective;
    if (S.tab === 'grades') renderGrades();
  });
  document.getElementById('btn-save-answers')?.addEventListener('click', async (e) => {
    e.stopPropagation();
    if (await saveAnswerEdits(attemptId)) await openGrading(attemptId, { keepOpen: true });
  });
  document.getElementById('btn-ocr-run')?.addEventListener('click', async (e) => {
    e.stopPropagation();
    const input = document.getElementById('ocr-files');
    const files = [...(input?.files || [])];
    if (!files.length) { toast('请先选择答卷照片'); return; }
    const btn = document.getElementById('btn-ocr-run');
    const prev = btn?.textContent;
    if (btn) { btn.disabled = true; btn.textContent = '识别中…'; }
    try {
      await loadTesseract();
      const lang = S.gradingAttempt?.check_in?.exam_lang === 'id' ? 'ind+eng' : 'chi_sim+eng';
      let all = '';
      for (const file of files) {
        const { data: { text } } = await window.Tesseract.recognize(file, lang);
        all += (all ? '\n\n' : '') + (text || '').trim();
      }
      const ta = document.getElementById('ocr-raw');
      if (ta) ta.value = all;
      toast(all ? '识别完成，请核对文字' : '未识别到文字，请换更清晰的照片');
    } catch (err) {
      console.warn(err);
      toast('识别失败，请手工输入或换更清晰照片');
    } finally {
      if (btn) { btn.disabled = false; btn.textContent = prev; }
    }
  });
  document.getElementById('btn-ocr-split')?.addEventListener('click', (e) => {
    e.stopPropagation();
    const raw = document.getElementById('ocr-raw')?.value || '';
    const paper = S.gradingAttempt?.paper || [];
    const n = applyOcrSplitToForm(raw, paper);
    toast(n ? `已填入 ${n} 道题，请核对后保存` : '未能按题号拆分，请手工复制到各题');
  });
  document.getElementById('btn-save-grade')?.addEventListener('click', async (e) => {
    e.stopPropagation();
    const payload = [...document.querySelectorAll(`tr[data-expand-for="${attemptId}"] .grade-box[data-gid]`)]
      .map((box) => ({
        group_id: box.dataset.gid,
        score: box.querySelector('[data-score]').value,
      }));
    const res = await sb.rpc('staff_student_exam_grade', {
      p_attempt_id: attemptId,
      p_items: payload,
    });
    if (res.data?.ok) {
      toast('已保存');
      await loadAttempts();
      await openGrading(attemptId);
    } else toast(res.data?.error || '保存失败');
  });
  document.getElementById('btn-delete-student')?.addEventListener('click', async (e) => {
    e.stopPropagation();
    const ci = S.gradingAttempt?.check_in;
    if (!ci || !S.selectedDayId) { toast('无法获取考生信息'); return; }
    const label = [ci.full_name, ci.internal_no, ci.phone_last4 ? `尾号${ci.phone_last4}` : ''].filter(Boolean).join(' / ');
    if (!confirm(`确定删除「${label}」今日全部签到与答卷？\n\n该学员所有科目记录将被清除，可重新签到。此操作不可恢复。`)) return;
    const res = await deleteStudentRecord({
      checkInId: ci.id,
      examDayId: S.selectedDayId,
      fullName: ci.full_name,
      phoneLast4: ci.phone_last4,
    });
    if (res.data?.ok) {
      toast('已删除该学员今日记录');
      S.expandedAttemptId = null;
      S.gradingAttempt = null;
      await loadAttempts();
      render();
    } else {
      const err = res.data?.error || res.error?.message || '失败';
      toast(clearStudentErrorText(err));
    }
  });
}

async function openGrading(attemptId, { keepOpen = false } = {}) {
  if (!keepOpen && S.expandedAttemptId === attemptId && S.gradingAttempt?.attempt?.id === attemptId && !S.gradingLoading) {
    S.expandedAttemptId = null;
    S.gradingAttempt = null;
    S.showObjective = false;
    if (S.tab === 'grades') renderGrades();
    else render();
    return;
  }
  if (S.expandedAttemptId !== attemptId) S.showObjective = false;
  S.expandedAttemptId = attemptId;
  S.gradingAttempt = null;
  S.gradingLoading = true;
  if (S.tab === 'grades') renderGrades();
  else render();

  const { data } = await sb.rpc('staff_student_exam_get_attempt', { p_attempt_id: attemptId });
  S.gradingLoading = false;
  if (!data?.ok) {
    toast('加载失败');
    S.expandedAttemptId = null;
    if (S.tab === 'grades') renderGrades();
    else render();
    return;
  }
  S.gradingAttempt = data;
  if (S.tab === 'grades') renderGrades();
  else render();
  scrollToExpanded(attemptId);
}

function exportCsv() {
  const hdr = ['姓名', '年级', '班级', '语言', '客观分', '主观分', '总分', '阅卷状态', '切屏', '交卷时间'];
  const lines = S.attempts.map((a) => [
    a.display_name, a.grade, trackLabelZh(a.class_track), a.exam_lang,
    a.objective_score ?? '', a.subjective_score ?? '', a.total_score ?? '',
    a.grading_status, a.proctor_flags ?? 0, a.submitted_at ?? '',
  ].map((c) => `"${String(c).replace(/"/g, '""')}"`).join(','));
  const blob = new Blob(['\uFEFF' + hdr.join(',') + '\n' + lines.join('\n')], { type: 'text/csv' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'exam-grades.csv';
  a.click();
}

      document.getElementById('import-status').textContent = `已加载 ${snap.length} 题（中文 + 印尼语，含客观题答案）`;
      toast('希伯来书试卷已加载（中/印尼语），点「保存试卷」入库');
    } catch (e) {
      toast('加载失败：' + (e.message || e));
    }
  };

  document.getElementById('btn-load-psalms').onclick = async () => {
    try {
      const r = await fetch('./papers/psalms-2025-2026.json');
      const snap = await r.json();
      document.getElementById('p-json').value = JSON.stringify(snap, null, 2);
      document.getElementById('p-title').value = '诗篇';
      document.getElementById('p-grade').value = '1';
      document.getElementById('p-course').value = 'PSA';
      document.getElementById('import-status').textContent = `已加载 ${snap.length} 题（中+英，满分 100）`;
      toast('诗篇试卷已加载，点「保存试卷」入库');
    } catch (e) {
      toast('加载失败：' + (e.message || e));
    }
  };

  document.getElementById('btn-import-docx').onclick = async () => {
    const status = document.getElementById('import-status');
    status.textContent = '解析中…';
    try {
      const parts = [];
      const zh = document.getElementById('f-docx-zh').files[0];
      const en = document.getElementById('f-docx-en').files[0];
      const idf = document.getElementById('f-docx-id').files[0];
      if (!zh && !en && !idf) { toast('请至少选择一个 .docx 文件'); status.textContent = ''; return; }
      let totalNeedKey = 0;
      let fmt = '';
      for (const [file, lang] of [[zh, 'zh'], [en, 'en'], [idf, 'id']]) {
        if (!file) continue;
        const r = await docxFileToSnapshot(file, lang);
        parts.push({ lang, snapshot: r.snapshot });
        totalNeedKey = Math.max(totalNeedKey, r.needsAnswerKey || 0);
        fmt = r.format || fmt;
      }
      const merged = parts.length === 1 ? parts[0].snapshot : mergeSnapshotsByIndex(parts);
      document.getElementById('p-json').value = JSON.stringify(merged, null, 2);
      const title = document.getElementById('p-title');
      const src = zh || en || idf;
      if (!title.value.trim() && src) title.value = src.name.replace(/\.docx$/i, '');
      status.textContent = `已解析 ${merged.length} 题（${fmt === 'course' ? '课程卷' : '招生卷'}）`;
      if (totalNeedKey > 0) {
        toast(`已解析 ${merged.length} 题；其中 ${totalNeedKey} 道客观题缺标准答案，需补答案卷或教师阅卷`);
      } else {
        toast('Word 已解析，请检查后保存');
      }
    } catch (e) {
      console.error(e);
      status.textContent = '';
      toast(e.message || '解析失败', false);
    }
  };

  document.getElementById('btn-save-paper').onclick = async () => {
    let snap;
    try { snap = JSON.parse(document.getElementById('p-json').value); }
    catch { toast('JSON 格式错误'); return; }
    const res = await sb.rpc('staff_student_exam_upsert_paper', {
      p_id: null,
      p_title: document.getElementById('p-title').value,
      p_grade: +document.getElementById('p-grade').value,
      p_course_code: document.getElementById('p-course').value,
      p_snapshot_json: snap,
      p_status: 'published',
    });
    if (res.data?.ok) { toast('试卷已保存'); await loadAll(); }
    else toast(res.data?.error || '失败');
  };
}

function paperSelectHtml(selectedId) {
  if (!S.papers.length) {
    return '<option value="">— 请先到「题库/试卷」创建试卷 —</option>';
  }
  const opts = S.papers.map((p) => {
    const langs = paperLocaleSummary(p);
    const suffix = langs ? ` [${langs}]` : '';
    return `<option value="${p.id}"${p.id === selectedId ? ' selected' : ''}>${esc(teacherPaperTitle(p.title, p.grade))}${esc(suffix)}</option>`;
  }).join('');
  return `<option value="">— 选择试卷 —</option>${opts}`;
}

function subjectRowHtml(opts = {}) {
  const { zh = true, en = true, id = true } = opts;
  return `<div class="sub-row" style="margin-bottom:12px;padding:12px;border:1px solid #e2e8f0;border-radius:10px">
    <div class="grid2">
      <div><label class="muted">科目名称</label><input class="inp sub-name" placeholder="如：启示录"></div>
      <div><label class="muted">绑定试卷 <span style="color:#dc2626">*</span></label><select class="sel sub-paper">${paperSelectHtml()}</select></div>
      <div><label class="muted">年级</label><input class="inp sub-grade" type="number" min="1" max="3" value="1"></div>
      <div>
        <label class="muted">班级（可多选，同一时段三语同考）</label>
        <div class="track-chks">
          <label><input type="checkbox" class="sub-track-chk" value="zh"${zh ? ' checked' : ''}> 中文班</label>
          <label><input type="checkbox" class="sub-track-chk" value="en"${en ? ' checked' : ''}> 英文班</label>
          <label><input type="checkbox" class="sub-track-chk" value="id"${id ? ' checked' : ''}> 印尼语班</label>
        </div>
        <div class="track-chk-actions">
          <button type="button" class="btn btn-o btn-sm btn-track-all">全选三语</button>
        </div>
      </div>
      <div><label class="muted">开始时间</label><input class="inp sub-start" type="datetime-local"></div>
      <div><label class="muted">结束时间</label><input class="inp sub-end" type="datetime-local"></div>
    </div>
  </div>`;
}

function bindSubjectRowActions(root) {
  (root || document).querySelectorAll('.btn-track-all').forEach((btn) => {
    btn.onclick = () => {
      const row = btn.closest('.sub-row');
      row?.querySelectorAll('.sub-track-chk').forEach((c) => { c.checked = true; });
    };
  });
}

function selectedTracksFromRow(row) {
  return [...row.querySelectorAll('.sub-track-chk:checked')].map((c) => c.value);
}

const TRACK_LABELS = { zh: '中文', en: '英文', id: '印尼语' };

function parseLocalDatetime(val) {
  if (!val) return null;
  const d = new Date(val);
  return isNaN(d.getTime()) ? null : d.toISOString();
}

function renderDays() {
  const noPaperWarn = S.papers.length
    ? ''
    : '<p class="muted" style="margin-bottom:12px;padding:10px;background:#fef3c7;border-radius:8px;color:#92400e">⚠️ 还没有试卷。请先到上方 <strong>题库/试卷</strong> 标签保存至少一份试卷，再回来排考。</p>';
  document.getElementById('tab-days').innerHTML = `
    <div class="card">
      <h2>创建考试日</h2>
      ${noPaperWarn}
      <input class="inp" id="d-title" placeholder="例如：2026 春季期末考">
      <input class="inp" id="d-date" type="date">
      <p class="muted" style="margin-bottom:12px;line-height:1.65">同一科目、同一时段若三语班级都要考：在一行里勾选「中文班 / 英文班 / 印尼语班」（默认三语全选），填一次时间与试卷即可；保存时自动拆成三条排考。也可只勾选一个班。</p>
      <div id="sub-rows">${subjectRowHtml()}</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:4px">
        <button class="btn btn-o" id="btn-add-sub" type="button">+ 添加科目</button>
        <button class="btn btn-o" id="btn-add-sub-tri" type="button">+ 添加科目（三语同考）</button>
      </div>
      <div style="margin-top:10px"><button class="btn" id="btn-save-day">保存考试日</button></div>
    </div>
    <div class="card">
      <h2>已有考试日</h2>
      <ul>${S.days.map((d) => `<li>${esc(d.title)} — ${d.exam_date} (${d.status})${d.status === 'closed' ? ' · 同日保存可覆盖重启' : ''}</li>`).join('') || '<li class="muted">暂无</li>'}</ul>
      <p class="muted" style="margin-top:8px">每天只能有一个考试日；若日期已存在，保存时将覆盖科目并重新启用。</p>
    </div>`;

  document.getElementById('btn-add-sub').onclick = () => {
    document.getElementById('sub-rows').insertAdjacentHTML('beforeend', subjectRowHtml({ zh: true, en: false, id: false }));
    bindSubjectRowActions(document.getElementById('sub-rows'));
  };

  document.getElementById('btn-add-sub-tri').onclick = () => {
    document.getElementById('sub-rows').insertAdjacentHTML('beforeend', subjectRowHtml({ zh: true, en: true, id: true }));
    bindSubjectRowActions(document.getElementById('sub-rows'));
  };

  bindSubjectRowActions(document.getElementById('sub-rows'));

  document.getElementById('btn-save-day').onclick = async () => {
    if (!S.papers.length) {
      toast('请先到「题库/试卷」创建并保存至少一份试卷');
      return;
    }
    const rows = [...document.querySelectorAll('.sub-row')];
    const subjects = [];
    let sort = 0;
    for (let i = 0; i < rows.length; i++) {
      const row = rows[i];
      const subject_name = row.querySelector('.sub-name')?.value?.trim();
      const paper_id = row.querySelector('.sub-paper')?.value;
      const grade = +row.querySelector('.sub-grade')?.value;
      const tracks = selectedTracksFromRow(row);
      const startRaw = row.querySelector('.sub-start')?.value;
      const endRaw = row.querySelector('.sub-end')?.value;
      const start_at = parseLocalDatetime(startRaw);
      const end_at = parseLocalDatetime(endRaw);
      const empty = !subject_name && !paper_id && !startRaw && !endRaw && !tracks.length;
      if (empty) continue;
      if (!subject_name) { toast(`第 ${i + 1} 门：请填写科目名称`); return; }
      if (!paper_id) { toast(`第 ${i + 1} 门「${subject_name}」：请选择试卷`); return; }
      if (!tracks.length) { toast(`第 ${i + 1} 门「${subject_name}」：请至少勾选一个班级`); return; }
      if (!start_at || !end_at) { toast(`第 ${i + 1} 门「${subject_name}」：请填写开始/结束时间`); return; }
      if (end_at <= start_at) { toast(`第 ${i + 1} 门「${subject_name}」：结束时间须晚于开始时间`); return; }
      const paper = S.papers.find((p) => p.id === paper_id);
      const locales = new Set(paper ? paperLocaleCodes(paper) : []);
      for (const class_track of tracks) {
        if (paper && !locales.has(class_track)) {
          toast(`第 ${i + 1} 门「${subject_name}」：试卷不含${TRACK_LABELS[class_track]}题干，请换卷或取消勾选`);
          return;
        }
        subjects.push({ subject_name, paper_id, grade, class_track, start_at, end_at, sort_order: sort++ });
      }
    }
    if (!subjects.length) { toast('请至少填写一门完整科目（含试卷与时间）'); return; }
    const title = document.getElementById('d-title')?.value?.trim();
    const examDate = document.getElementById('d-date')?.value;
    if (!title) { toast('请填写考试日名称'); return; }
    if (!examDate) { toast('请选择考试日期'); return; }
    const existing = S.days.find((d) => d.exam_date === examDate);
    if (existing && !confirm(`该日期已有考试日「${existing.title}」（${existing.status}），将覆盖科目安排并重新启用。继续？`)) return;
    const res = await sb.rpc('staff_student_exam_upsert_day', {
      p_id: null,
      p_title: title,
      p_exam_date: examDate,
      p_status: 'active',
      p_subjects: subjects,
    });
    if (res.data?.ok) {
      toast(res.data.reused_date ? '考试日已更新（同日覆盖）' : '考试日已创建');
      await loadAll();
      render();
    } else toast(dayErrorText(res.data?.error) || res.error?.message || '失败');
  };
}

function renderAdmin() {
  const dayOpts = S.days.map((d) =>
    `<option value="${d.id}">${esc(d.title)} — ${d.exam_date} (${d.status})</option>`
  ).join('');
  document.getElementById('tab-admin').innerHTML = `
    <div class="card">
      <h2>考试管理</h2>
      <p class="muted" style="margin-bottom:12px;line-height:1.65;padding:10px 12px;background:#f8fafc;border-radius:8px;border:1px solid #e2e8f0">
        <strong>一键终止考试</strong>：立即关闭所选考试日，并强制交卷所有进行中的答卷。<br>
        <strong>删除考试日</strong>：永久删除该日全部排考、签到与答卷（未开始或进行中均可删，用于重新排考）。<br>
        <strong>清除考生记录</strong>：删除指定学员今日签到与全部科目答卷（填错姓名/年级/语言时使用，学生可重新签到）。<br>
        <strong>清除测试账号</strong>：快捷清除测试用记录（姓名 <strong>张</strong>、手机尾号 <strong>5668</strong>）。
      </p>
      <label class="muted">选择考试日</label>
      <select class="sel" id="admin-day">${dayOpts || '<option value="">— 暂无考试日 —</option>'}</select>
      <div class="admin-warn" style="margin-top:14px">
        <strong>清除考生记录</strong>（填错信息、需让学生重新签到时）
        <div class="grid2" style="margin-top:10px;gap:10px">
          <input class="inp" id="clear-name" placeholder="考生姓名（与签到时一致）" style="margin:0">
          <input class="inp" id="clear-pl4" placeholder="手机/WhatsApp 后 4 位（建议填写）" inputmode="numeric" maxlength="4" style="margin:0">
        </div>
        <button class="btn btn-danger" type="button" id="btn-clear-student" style="margin-top:10px">清除该考生今日记录</button>
      </div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:14px">
        <button class="btn btn-danger" type="button" id="btn-end-day">一键终止考试</button>
        <button class="btn btn-o" type="button" id="btn-delete-day" style="border-color:#fca5a5;color:#dc2626">删除考试日</button>
        <button class="btn btn-o" type="button" id="btn-clear-test-student" style="border-color:#fca5a5;color:#dc2626">清除测试账号（张 / 5668）</button>
      </div>
      <p class="muted" id="admin-status" style="margin-top:12px"></p>
    </div>`;

  document.getElementById('btn-end-day').onclick = async () => {
    const id = document.getElementById('admin-day').value;
    if (!id) { toast('请选择考试日'); return; }
    if (!confirm('确定终止该考试日？所有未交卷学生将被强制交卷，且无法再开考。')) return;
    const res = await sb.rpc('staff_student_exam_end_day', { p_exam_day_id: id });
    const st = document.getElementById('admin-status');
    if (res.data?.ok) {
      st.textContent = `已终止。强制交卷 ${res.data.forced_submit_count ?? 0} 份。`;
      toast('考试已终止');
      await loadAll();
      render();
    } else {
      const err = res.data?.error || res.error?.message || '失败';
      st.textContent = dayErrorText(err) || err;
      toast(err.includes('23514') ? '终止失败：考试尚未开始，请改用「删除考试日」' : (dayErrorText(err) || '操作失败'));
    }
  };

  document.getElementById('btn-delete-day').onclick = async () => {
    const sel = document.getElementById('admin-day');
    const id = sel.value;
    if (!id) { toast('请选择考试日'); return; }
    const day = S.days.find((d) => d.id === id);
    const label = day ? `${day.title}（${day.exam_date}）` : '该考试日';
    if (!confirm(`确定永久删除「${label}」？\n\n将删除该日全部排考、签到与答卷，且无法恢复。`)) return;
    const res = await sb.rpc('staff_student_exam_delete_day', { p_exam_day_id: id });
    const st = document.getElementById('admin-status');
    if (res.data?.ok) {
      st.textContent = `已删除考试日「${res.data.title || label}」。`;
      toast('考试日已删除');
      if (S.selectedDayId === id) S.selectedDayId = null;
      await loadAll();
      render();
    } else {
      const err = res.data?.error || res.error?.message || '失败';
      st.textContent = dayErrorText(err) || err;
      if (err.includes('Could not find') || err.includes('does not exist')) {
        toast('请先在 Supabase 执行迁移 20260613100000_student_exam_delete_day.sql');
      } else {
        toast(dayErrorText(err) || '删除失败');
      }
    }
  };

  document.getElementById('btn-clear-student').onclick = async () => {
    const id = document.getElementById('admin-day').value;
    const name = document.getElementById('clear-name').value.trim();
    const pl4 = document.getElementById('clear-pl4').value.trim();
    if (!id) { toast('请选择考试日'); return; }
    if (!name) { toast('请填写考生姓名'); return; }
    const label = pl4 ? `${name} / 尾号${pl4}` : name;
    if (!confirm(`确定清除「${label}」在该考试日的全部签到与答卷？\n\n学生可重新签到，此操作不可恢复。`)) return;
    const res = await sb.rpc('staff_student_exam_clear_check_in', {
      p_exam_day_id: id,
      p_full_name: name,
      p_phone_last4: pl4 || null,
    });
    const st = document.getElementById('admin-status');
    if (res.data?.ok) {
      const n = res.data.deleted_check_ins ?? 0;
      st.textContent = n
        ? `已删除 ${res.data.full_name}${res.data.phone_last4 ? ` / 尾号${res.data.phone_last4}` : ''} 的签到与全部答卷。`
        : `未找到匹配记录：${name}${pl4 ? ` / 尾号${pl4}` : ''}。请核对姓名与手机后四位。`;
      toast(n ? '考生记录已清除' : '未找到匹配记录');
      if (n) {
        document.getElementById('clear-name').value = '';
        document.getElementById('clear-pl4').value = '';
      }
      await loadAll();
      render();
    } else {
      const err = res.data?.error || res.error?.message || '失败';
      st.textContent = clearStudentErrorText(err);
      toast(err.includes('does not exist') || err.includes('Could not find')
        ? '请先在 Supabase 执行迁移 20260615110000_student_exam_clear_check_in_by_name.sql'
        : clearStudentErrorText(err));
    }
  };

  document.getElementById('btn-clear-test-student').onclick = async () => {
    const id = document.getElementById('admin-day').value;
    if (!id) { toast('请选择考试日'); return; }
    if (!confirm('确定清除测试账号「张 / 尾号 5668」在该考试日的签到与答卷？其他考生不受影响。')) return;
    const res = await sb.rpc('staff_student_exam_clear_test_student', {
      p_exam_day_id: id,
      p_full_name: '张',
      p_phone_last4: '5668',
    });
    const st = document.getElementById('admin-status');
    if (res.data?.ok) {
      const n = res.data.deleted_check_ins ?? 0;
      st.textContent = n
        ? `已删除测试账号 ${res.data.full_name} / ${res.data.phone_last4} 的 ${n} 条签到（含关联答卷）。`
        : '未找到匹配的测试账号记录（张 / 5668）。';
      toast(n ? '测试记录已清除' : '无匹配记录');
      await loadAll();
      render();
    } else {
      const err = res.data?.error || res.error?.message || '失败';
      st.textContent = err === 'forbidden' ? '无权限' : err;
      toast(err.includes('does not exist') || err.includes('Could not find')
        ? '请先在 Supabase 执行迁移 20260611160000_student_exam_clear_test_student.sql'
        : '操作失败');
    }
  };
}

function render() {
  document.querySelectorAll('.tab').forEach((t) => {
    t.classList.toggle('on', t.dataset.tab === S.tab);
  });
  document.getElementById('tab-grades').style.display = S.tab === 'grades' ? 'block' : 'none';
  document.getElementById('tab-papers').style.display = S.tab === 'papers' ? 'block' : 'none';
  document.getElementById('tab-days').style.display = S.tab === 'days' ? 'block' : 'none';
  document.getElementById('tab-admin').style.display = S.tab === 'admin' ? 'block' : 'none';
  if (S.tab === 'grades') renderGrades();
  if (S.tab === 'papers') renderPapers();
  if (S.tab === 'days') renderDays();
  if (S.tab === 'admin') renderAdmin();
}

document.querySelectorAll('.tab').forEach((t) => {
  t.addEventListener('click', () => { S.tab = t.dataset.tab; render(); });
});

if (window.__pendingTeacherLogin) {
  const p = window.__pendingTeacherLogin;
  delete window.__pendingTeacherLogin;
  await enterApp(p.user, p.profile, p.email);
} else {
  try {
    const { data } = await withTimeout(sb.auth.getSession(), 20000);
    if (data?.session?.user) {
      const { data: prof } = await withTimeout(
        sb.from('profiles').select('*').eq('id', data.session.user.id).single(),
        20000,
      );
      if (prof && ['admin', 'teacher'].includes(prof.role)) {
        await enterApp(data.session.user, prof, data.session.user.email);
      }
    }
  } catch (_) {}
}
})();
</script>
</body>
</html>
