<script type="module">
import {
  createSb, SESSION_KEY, LANG_KEY, t, tFmt, esc, fmtTime, fmtTimer,
  gradeLabel, trackLabel, classTrackOptions, examLangForTrack,
  resolvePaperDisplayTitle, examContentLang,
  renderExamWithSections, collectAnswers, installProctor, installEssayCounters, fillBlankCount,
  isFlexMakeupSubject, isInMakeupSession, getMakeupSchedule, getMakeupSubjectState,
  resolveExamDeadlineIso, examTimerSeconds,
  isCoverConfirmed, setCoverConfirmed, clearCoverConfirmed, withTimeout,
  resolveExamDay, rpcDirect, rpcCall, saveExamDayCache,
  EXAM_DAY_EMERGENCY, jakartaTodayYmd, loadExamDayCache, examDayFromQuery,
  EXAM_DAY_SPRING, EXAM_DAY_MAKEUP,
  scheduleHasActionableExam,
} from './shared.js?v=202606221700';

const DRAFT_BASE_MS = 30000;
const DRAFT_JITTER_MS = 15000;
const LOCAL_DRAFT_KEY = 'mms_exam_local_draft_v1';

function draftJitterMs() {
  let j = sessionStorage.getItem('mms_draft_jitter_ms');
  if (!j) {
    j = String(Math.floor(Math.random() * DRAFT_JITTER_MS));
    sessionStorage.setItem('mms_draft_jitter_ms', j);
  }
  return DRAFT_BASE_MS + Number(j);
}

const sb = createSb();
const S = {
  uiLang: localStorage.getItem(LANG_KEY) || 'zh',
  token: localStorage.getItem(SESSION_KEY) || null,
  examDay: null,
  checkIn: null,
  schedule: [],
  view: 'loading',
  syncing: false,
  subject: null,
  paper: null,
  attempt: null,
  answers: {},
  proctorFlags: 0,
  timerSec: 0,
  timerTotal: 0,
  timerWarn10m: false,
  editingCheckIn: false,
  submitting: false,
};

let timerIv = null;
let draftTimer = null;
let submitCooldownUntil = 0;
let submitCooldownIv = null;
const SUBMIT_COOLDOWN_MS = 12000;

function toast(msg, ok = true) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show' + (ok ? '' : ' err');
  setTimeout(() => el.classList.remove('show'), 2800);
}

function setLang(lang) {
  S.uiLang = lang;
  localStorage.setItem(LANG_KEY, lang);
  document.querySelectorAll('#lang-sw button').forEach((b) => {
    b.classList.toggle('on', b.dataset.lang === lang);
  });
  document.getElementById('site-title').textContent = t(lang, 'site');
  render();
}

let loadTodayBusy = false;

async function maybeResumeMakeupExam() {
  if (!S.token || !isInMakeupSession(S.schedule)) return false;
  const queue = getMakeupSchedule(S.schedule);
  const inProg = queue.find((s) => s.attempt_status === 'in_progress');
  if (!inProg) return false;
  S.subject = inProg;
  await enterExam(inProg, S.checkIn?.full_name);
  return true;
}

async function loadScheduleIfToken() {
  if (!S.token) return;
  const { data: schData, error } = await rpcCall('student_exam_get_schedule', { p_token: S.token }, { timeoutMs: 10000, tries: 3 });
  if (!error && schData?.ok) {
    S.checkIn = schData.check_in;
    S.schedule = schData.subjects || [];
    if (isInMakeupSession(S.schedule)) {
      if (await maybeResumeMakeupExam()) return;
      S.view = 'schedule';
    } else if (scheduleHasActionableExam(S.schedule)) {
      S.view = 'schedule';
    } else {
      S.view = 'no_exam';
    }
    render();
    return;
  }
  console.warn('get_schedule', error);
  S.token = null;
  localStorage.removeItem(SESSION_KEY);
  S.view = S.examDay ? 'checkin' : 'no_exam';
  render();
}

async function loadToday() {
  if (!sb) {
    S.view = 'boot_err';
    render();
    return;
  }
  if (loadTodayBusy) return;
  loadTodayBusy = true;

  const today = jakartaTodayYmd();
  const queryDay = examDayFromQuery();
  const instant = queryDay || loadExamDayCache(today) || EXAM_DAY_EMERGENCY[today];
  if (instant) {
    S.examDay = instant;
    S.view = 'checkin';
    S.syncing = true;
    render();
  } else {
    S.view = 'loading';
    render();
  }

  try {
    const { examDay, fromFallback } = await resolveExamDay();
    if (!examDay) {
      if (S.token) {
        const { data: schData } = await rpcCall('student_exam_get_schedule', { p_token: S.token }, { timeoutMs: 10000, tries: 2 });
        if (schData?.ok && schData.check_in) {
          S.checkIn = schData.check_in;
          S.schedule = schData.subjects || [];
          if (isInMakeupSession(S.schedule) || scheduleHasActionableExam(S.schedule)) {
            S.examDay = {
              id: schData.check_in.exam_day_id,
              title: 'MMS2026春季期末考试',
              exam_date: '2026-06-15',
              timezone: 'Asia/Jakarta',
              status: 'active',
            };
            if (await maybeResumeMakeupExam()) return;
            S.view = 'schedule';
          } else {
            S.view = 'no_exam';
          }
          return;
        }
      }
      S.examDay = null;
      S.view = 'no_exam';
      return;
    }
    S.examDay = queryDay || examDay;
    if (S.view !== 'schedule') S.view = 'checkin';
    if (fromFallback && !queryDay) toast(t(S.uiLang, 'err_load_offline'), true);
    render();
    await loadScheduleIfToken();
  } catch (e) {
    console.warn('loadToday', e);
    if (!instant) {
      S.view = 'boot_err';
      toast(t(S.uiLang, 'err_load_fail'), false);
    }
  } finally {
    loadTodayBusy = false;
    S.syncing = false;
    render();
  }
}

function getCheckInTrack() {
  return document.querySelector('input[name="f-track"]:checked')?.value || 'zh';
}

function canEditCheckIn() {
  if (isInMakeupSession(S.schedule)) return false;
  return !(S.schedule || []).some((s) =>
    s.attempt_status === 'in_progress' || s.attempt_status === 'submitted'
  );
}

function isMakeupExamView() {
  return S.view === 'exam' && isFlexMakeupSubject(S.subject);
}

function rpcErrorText(code) {
  const key = {
    check_in_locked: 'err_check_in_locked',
    phone_last4_required: 'phone_last4',
    window_closed: 'err_window_closed',
    makeup_in_progress: 'err_makeup_in_progress',
    makeup_wait_previous: 'err_makeup_wait_previous',
    not_on_makeup_roster: 'err_not_on_makeup_roster',
    subject_not_allowed: 'err_subject_not_allowed',
    submit_failed: 'err_submit_fail',
    not_found: 'err',
  }[code];
  return key ? t(S.uiLang, key) : code;
}

function isNetworkError(err) {
  const m = String(err?.message || err || '').toLowerCase();
  return m.includes('fetch') || m.includes('network') || m.includes('timeout') || m.includes('failed to load');
}

async function rpcWithRetry(fn, payload, { tries = 5, delayMs = 2000, timeoutMs = 15000, onAttempt } = {}) {
  let lastErr = null;
  for (let i = 0; i < tries; i++) {
    onAttempt?.(i + 1, tries);
    const { data, error } = await rpcCall(fn, payload, { timeoutMs, tries: 1, delayMs: 0 });
    if (!error && data?.ok !== false) return { data, error: null };
    if (data?.ok === false && data?.error === 'already_submitted') return { data, error: null };
    if (data?.ok === false && !isNetworkError({ message: data?.error })) {
      return { data, error: error || { message: data?.error } };
    }
    lastErr = error || { message: data?.error || 'rpc_fail' };
    if (i < tries - 1) {
      await new Promise((r) => setTimeout(r, delayMs * (i + 1)));
    }
  }
  return { data: null, error: lastErr };
}

function setSubmitButton(btn, { disabled, text } = {}) {
  if (!btn) return;
  btn.disabled = !!disabled;
  btn.style.pointerEvents = disabled ? 'none' : '';
  if (text != null) btn.textContent = text;
}

function startSubmitCooldown(btn) {
  submitCooldownUntil = Date.now() + SUBMIT_COOLDOWN_MS;
  clearInterval(submitCooldownIv);
  const tick = () => {
    const left = Math.ceil((submitCooldownUntil - Date.now()) / 1000);
    if (left <= 0) {
      clearInterval(submitCooldownIv);
      submitCooldownIv = null;
      setSubmitButton(btn, {
        disabled: false,
        text: t(S.uiLang, 'btn_submit_retry'),
      });
      return;
    }
    setSubmitButton(btn, {
      disabled: true,
      text: tFmt(S.uiLang, 'submit_cooldown', { s: left }),
    });
  };
  tick();
  submitCooldownIv = setInterval(tick, 500);
}

async function recoverIfAlreadySubmitted() {
  if (!S.token || !S.subject?.id) return false;
  const btn = document.getElementById('btn-submit');
  setSubmitButton(btn, { disabled: true, text: t(S.uiLang, 'submit_checking') });
  const { data } = await rpcCall('student_exam_get_schedule', { p_token: S.token }, { timeoutMs: 10000, tries: 2 });
  const sub = (data?.subjects || []).find((x) => x.id === S.subject.id);
  if (sub?.attempt_status === 'submitted') {
    await finishSubmitSuccess();
    return true;
  }
  return false;
}

async function finishSubmitSuccess() {
  S.submitting = false;
  try { sessionStorage.removeItem(LOCAL_DRAFT_KEY); } catch (_) {}
  clearInterval(submitCooldownIv);
  submitCooldownIv = null;
  submitCooldownUntil = 0;
  toast(t(S.uiLang, 'submitted_ok'));
  await refreshSchedule();
  if (isInMakeupSession(S.schedule) && scheduleHasActionableExam(S.schedule)) {
    S.view = 'schedule';
  } else if (isInMakeupSession(S.schedule)) {
    S.view = 'no_exam';
  } else {
    S.view = 'done';
  }
  render();
}

function goEditCheckIn() {
  if (!canEditCheckIn()) {
    toast(t(S.uiLang, 'err_check_in_locked'), false);
    return;
  }
  S.editingCheckIn = true;
  S.view = 'checkin';
  render();
}

async function doCheckIn(resume = false) {
  const name = document.getElementById('f-name')?.value?.trim();
  const grade = +document.getElementById('f-grade')?.value;
  const classTrack = getCheckInTrack();
  const examLang = examLangForTrack(classTrack);
  const pl4 = document.getElementById('f-pl4')?.value?.trim() || null;
  if (!name) { toast(t(S.uiLang, 'full_name') + '?', false); return; }

  const btn = document.getElementById('btn-checkin');
  const resumeBtn = document.getElementById('btn-resume');
  if (btn) btn.disabled = true;
  if (resumeBtn) resumeBtn.disabled = true;

  try {
    if (S.editingCheckIn && S.token && !resume) {
      if (!canEditCheckIn()) {
        toast(t(S.uiLang, 'err_check_in_locked'), false);
        S.editingCheckIn = false;
        S.view = 'schedule';
        render();
        return;
      }
      const { data, error } = await rpcCall('student_exam_update_check_in', {
        p_token: S.token,
        p_full_name: name,
        p_grade: grade,
        p_class_track: classTrack,
        p_phone_last4: pl4,
        p_ui_lang: S.uiLang,
        p_exam_lang: examLang,
      }, { tries: 4 });
      if (error || !data?.ok) {
        toast(rpcErrorText(data?.error) || t(S.uiLang, 'err'), false);
        return;
      }
      S.checkIn = data.check_in;
      clearCoverConfirmed();
      S.editingCheckIn = false;
      await refreshSchedule();
      toast(t(S.uiLang, 'checkin_saved'));
      return;
    }

    const tryCheckIn = async (examDayId) => {
      if (resume && pl4) {
        return rpcCall('student_exam_resume', {
          p_exam_day_id: examDayId, p_full_name: name, p_grade: grade, p_phone_last4: pl4, p_class_track: classTrack,
        }, { timeoutMs: 15000, tries: 4 });
      }
      return rpcCall('student_exam_check_in', {
        p_exam_day_id: examDayId,
        p_full_name: name,
        p_grade: grade,
        p_ui_lang: S.uiLang,
        p_exam_lang: examLang,
        p_phone_last4: pl4,
        p_resume_token: S.token || null,
        p_class_track: classTrack,
      }, { timeoutMs: 15000, tries: 4 });
    };

    let usedDay = S.examDay;
    let { data, error } = await tryCheckIn(S.examDay.id);

    // 今日默认补考日：期末补考名单（如郑智成·撒母耳记）自动改签春季期末考试日
    if ((data?.error === 'not_on_makeup_roster' || data?.error === 'not_found')
      && S.examDay.id === EXAM_DAY_MAKEUP.id) {
      const alt = await tryCheckIn(EXAM_DAY_SPRING.id);
      if (alt.data?.ok) {
        data = alt.data;
        error = alt.error;
        usedDay = EXAM_DAY_SPRING;
        saveExamDayCache(EXAM_DAY_SPRING);
      }
    }

    if (error || !data?.ok) {
      const errMsg = data?.error
        ? rpcErrorText(data.error)
        : (error?.message?.includes('duplicate key') || error?.message?.includes('internal_no')
          ? t(S.uiLang, 'err_checkin_server')
          : (isNetworkError(error) ? t(S.uiLang, 'err_load_fail') : (error?.message || t(S.uiLang, 'err'))));
      toast(errMsg, false);
      return;
    }
    S.token = data.check_in.session_token;
    localStorage.setItem(SESSION_KEY, S.token);
    S.checkIn = data.check_in;
    S.examDay = usedDay;
    if (!data.resumed) clearCoverConfirmed();
    S.editingCheckIn = false;
    await refreshSchedule();
  } finally {
    if (btn) btn.disabled = false;
    if (resumeBtn) resumeBtn.disabled = false;
  }
}

async function refreshSchedule() {
  const { data } = await rpcCall('student_exam_get_schedule', { p_token: S.token }, { tries: 3 });
  if (data?.ok) {
    S.checkIn = data.check_in;
    S.schedule = data.subjects || [];
    if (S.view !== 'exam' && await maybeResumeMakeupExam()) return;
    if (!scheduleHasActionableExam(S.schedule) && !isInMakeupSession(S.schedule)) {
      S.view = 'no_exam';
    } else if (S.view !== 'exam') {
      S.view = 'schedule';
    }
    render();
  }
}

async function openCover(subjectId) {
  const sub = S.schedule.find((x) => x.id === subjectId);
  if (!sub) return;
  if (isInMakeupSession(S.schedule)) {
    const queue = getMakeupSchedule(S.schedule);
    const state = getMakeupSubjectState(queue, sub);
    if (state === 'locked') {
      toast(t(S.uiLang, 'err_makeup_wait_previous'), false);
      return;
    }
    if (state === 'done') return;
  }
  if (sub.window_status === 'upcoming') { toast(t(S.uiLang, 'window_upcoming'), false); return; }
  if (sub.window_status === 'ended' && sub.attempt_status !== 'in_progress') {
    toast(t(S.uiLang, 'window_ended'), false);
    return;
  }
  if (sub.attempt_status === 'submitted') {
    S.view = 'done';
    S.subject = sub;
    render();
    return;
  }
  S.subject = sub;
  if (sub.attempt_status === 'in_progress' && sub.attempt_id) {
    await enterExam(sub, S.checkIn?.full_name);
    return;
  }
  if (isCoverConfirmed(S.examDay?.id, S.token)) {
    await enterExam(sub, S.checkIn?.full_name);
    return;
  }
  S.view = 'cover';
  render();
}

const PAPER_CACHE_KEY = 'mms_student_exam_paper_v17';

function normalizeExamAnswers(questions, answers) {
  const out = { ...(answers || {}) };
  for (const q of questions || []) {
    const gid = q.group_id;
    if (q.type === 'essay' || q.type === 'dictation') {
      if (Array.isArray(out[gid])) out[gid] = '';
    }
  }
  return out;
}

function paperCacheLooksStale(paper) {
  const qs = paper?.questions || [];
  return qs.some((q) => q.type === 'single' && !(Array.isArray(q.options) && q.options.length));
}

function clearPaperCache() {
  try { sessionStorage.removeItem(PAPER_CACHE_KEY); } catch (_) {}
}

function loadPaperCache(subjectId) {
  try {
    const raw = sessionStorage.getItem(PAPER_CACHE_KEY);
    if (!raw) return null;
    const o = JSON.parse(raw);
    if (o?.subjectId !== subjectId || !o?.paper?.ok) return null;
    if (paperCacheLooksStale(o.paper)) return null;
    return o.paper;
  } catch (_) {}
  return null;
}

function savePaperCache(subjectId, paper) {
  if (!paper?.ok) return;
  try {
    sessionStorage.setItem(PAPER_CACHE_KEY, JSON.stringify({ subjectId, paper, ts: Date.now() }));
  } catch (_) {}
}

async function pauseExamAndReturnToSchedule() {
  const root = document.getElementById('exam-root');
  if (root) S.answers = collectAnswers(root);
  await saveDraft({ silent: true });
  saveLocalDraft();
  clearInterval(timerIv);
  clearTimeout(draftTimer);
  S.view = 'schedule';
  await refreshSchedule();
  toast(t(S.uiLang, 'pause_exam'), true);
}

async function enterExam(sub, displayName) {
  const name = displayName?.trim();
  if (!name) return;
  toast(t(S.uiLang, 'loading'), true);
  const { data, error } = await rpcCall('student_exam_start_attempt', {
    p_token: S.token,
    p_day_subject_id: sub.id,
    p_display_name: name,
  }, { timeoutMs: 15000, tries: 4 });
  if (error || !data?.ok) {
    toast(rpcErrorText(data?.error) || t(S.uiLang, 'err'), false);
    return;
  }
  if (!data.attempt?.id) {
    toast(t(S.uiLang, 'err'), false);
    console.error('start_attempt missing attempt id', data);
    return;
  }
  S.attempt = data.attempt;
  S.answers = S.attempt.answers_json || {};
  const localDraft = loadLocalDraft(S.attempt.id);
  if (localDraft?.answers && Object.keys(localDraft.answers).length > Object.keys(S.answers).length) {
    S.answers = { ...S.answers, ...localDraft.answers };
  }
  S.proctorFlags = S.attempt.proctor_flags || localDraft?.proctorFlags || 0;

  let paperData = null;
  const paperRes = await rpcCall('student_exam_get_paper', { p_token: S.token, p_day_subject_id: sub.id }, { timeoutMs: 20000, tries: 4 });
  if (paperRes.data?.ok) {
    paperData = paperRes.data;
    savePaperCache(sub.id, paperData);
  } else {
    paperData = loadPaperCache(sub.id);
    if (!paperData) {
      toast(t(S.uiLang, 'err'), false);
      return;
    }
  }
  S.paper = paperData;
  S.subject = { ...sub, ...paperData.subject };
  S.answers = normalizeExamAnswers(S.paper?.questions, S.answers);
  S.timerSec = examTimerSeconds(S.subject, S.attempt);
  S.timerTotal = S.timerSec;
  S.timerWarn10m = false;
  S.view = 'exam';
  render();
  startTimer();
  startDraftSave();
  installProctor(() => {
    if (S.view !== 'exam') return;
    S.proctorFlags++;
    toast(t(S.uiLang, 'proctor_warn'), false);
  });
}

async function confirmCoverAndStart() {
  const displayName = document.getElementById('cover-name')?.value?.trim();
  if (!displayName) return;
  setCoverConfirmed(S.examDay?.id, S.token);
  await enterExam(S.subject, displayName);
}

function startTimer() {
  clearInterval(timerIv);
  if (S.timerSec <= 600 && !S.timerWarn10m) {
    S.timerWarn10m = true;
    toast(t(S.uiLang, 'timer_10m'), false);
  }
  timerIv = setInterval(() => {
    S.timerSec--;
    const d = document.getElementById('timer-d');
    const f = document.getElementById('timer-fill');
    if (d) d.textContent = fmtTimer(S.timerSec);
    if (f && S.timerTotal) f.style.width = `${((S.timerTotal - S.timerSec) / S.timerTotal) * 100}%`;
    if (S.timerSec <= 600 && !S.timerWarn10m) {
      S.timerWarn10m = true;
      toast(t(S.uiLang, 'timer_10m'), false);
    }
    if (S.timerSec <= 0) submitExam('timeout');
  }, 1000);
}

function saveLocalDraft() {
  if (!S.attempt?.id) return;
  try {
    sessionStorage.setItem(LOCAL_DRAFT_KEY, JSON.stringify({
      attemptId: S.attempt.id,
      answers: S.answers,
      proctorFlags: S.proctorFlags,
      ts: Date.now(),
    }));
  } catch (_) {}
}

function loadLocalDraft(attemptId) {
  try {
    const raw = sessionStorage.getItem(LOCAL_DRAFT_KEY);
    if (!raw) return null;
    const o = JSON.parse(raw);
    if (o?.attemptId === attemptId && o.answers) return o;
  } catch (_) {}
  return null;
}

function startDraftSave() {
  clearTimeout(draftTimer);
  const tick = async () => {
    await saveDraft();
    draftTimer = setTimeout(tick, draftJitterMs());
  };
  draftTimer = setTimeout(tick, draftJitterMs());
}

let draftSaving = false;
async function saveDraft({ silent = true } = {}) {
  if (!S.attempt?.id || S.view !== 'exam' || draftSaving) return;
  draftSaving = true;
  const root = document.getElementById('exam-root');
  S.answers = collectAnswers(root);
  saveLocalDraft();
  try {
    const { error } = await rpcCall('student_exam_save_draft', {
      p_token: S.token,
      p_attempt_id: S.attempt.id,
      p_answers: S.answers,
      p_proctor_flags: S.proctorFlags,
    }, { timeoutMs: 15000, tries: 2 });
    if (error && !silent) toast(t(S.uiLang, 'err_submit'), false);
  } catch (_) {
    if (!silent) toast(t(S.uiLang, 'err_submit'), false);
  }
  draftSaving = false;
}

async function submitExam(submitType = 'manual') {
  if (S.submitting) {
    if (submitType === 'manual') toast(t(S.uiLang, 'submit_busy'), false);
    return;
  }
  if (submitType === 'manual' && Date.now() < submitCooldownUntil) {
    toast(t(S.uiLang, 'submit_busy'), false);
    return;
  }

  const btn = document.getElementById('btn-submit');
  if (submitType === 'manual' && await recoverIfAlreadySubmitted()) return;

  S.submitting = true;
  clearInterval(timerIv);
  clearTimeout(draftTimer);
  const root = document.getElementById('exam-root');
  S.answers = collectAnswers(root);
  setSubmitButton(btn, { disabled: true, text: t(S.uiLang, 'err_submitting') });
  toast(t(S.uiLang, 'err_submitting'), true);

  const tries = submitType === 'timeout' ? 12 : 8;
  const { data, error } = await rpcWithRetry('student_exam_submit', {
    p_token: S.token,
    p_attempt_id: S.attempt.id,
    p_answers: S.answers,
    p_proctor_flags: S.proctorFlags,
    p_submit_type: submitType,
  }, {
    tries,
    delayMs: 2000,
    timeoutMs: 20000,
    onAttempt: (n, total) => {
      setSubmitButton(btn, {
        disabled: true,
        text: tFmt(S.uiLang, 'submitting_progress', { n, total }),
      });
    },
  });

  S.submitting = false;

  if (error || (!data?.ok && !data?.already)) {
    if (data?.error !== 'already_submitted') {
      if (await recoverIfAlreadySubmitted()) return;
      const msg = data?.error
        ? rpcErrorText(data.error)
        : (isNetworkError(error) ? t(S.uiLang, 'err_submit_network') : t(S.uiLang, 'err_submit_fail'));
      toast(msg, false);
      saveLocalDraft();
      if (S.view === 'exam' && S.timerSec > 0) {
        startTimer();
        startDraftSave();
      }
      if (submitType === 'manual') startSubmitCooldown(btn);
      else setSubmitButton(btn, { disabled: false, text: t(S.uiLang, 'submit') });
      return;
    }
  }
  await finishSubmitSuccess();
}

function renderSchedule() {

      paper_title: sub.paper_display_title || sub.paper_title,

      subject_name: sub.subject_name,
      course_code: sub.course_code,
    }, L);
    const min = sub.duration_minutes || 60;
    const mState = makeupMode ? getMakeupSubjectState(queue, sub) : null;
    let st = t(L, 'status_not_started');
    let btn = '';
    let tagCls = 'tag-up';
    let tagTxt = tFmt(L, 'makeup_label', { min });
    if (makeupMode) {

        st = t(L, 'status_submitted');
        tagCls = 'tag-end';
        btn = `<button class="btn btn-o" disabled>${esc(t(L, 'btn_done'))}</button>`;
      } else if (mState === 'active') {
        st = t(L, 'status_in_progress');
        tagCls = 'tag-open';
        btn = `<button class="btn btn-p" data-open="${sub.id}">${esc(t(L, 'btn_continue'))}</button>`;
      } else if (mState === 'ready') {
        st = t(L, 'status_not_started');
        tagCls = 'tag-open';
        btn = `<button class="btn btn-p" data-open="${sub.id}">${esc(t(L, 'btn_start_makeup'))}</button>`;
      } else {
        st = t(L, 'makeup_locked');
        tagCls = 'tag-up';
        btn = `<button class="btn btn-o" disabled>${esc(t(L, 'makeup_locked'))}</button>`;
      }
    } else {
      const ws = sub.window_status;
      tagCls = ws === 'open' ? 'tag-open' : ws === 'ended' ? 'tag-end' : 'tag-up';
      tagTxt = t(L, `window_${ws}`);
      if (sub.attempt_status === 'submitted') {
        st = t(L, 'status_submitted');
        btn = `<button class="btn btn-o" disabled>${esc(t(L, 'btn_done'))}</button>`;
      } else if (sub.attempt_status === 'in_progress') {
        st = t(L, 'status_in_progress');
        btn = `<button class="btn btn-p" data-open="${sub.id}">${esc(t(L, 'btn_continue'))}</button>`;
      } else if (ws === 'open') {
        btn = `<button class="btn btn-p" data-open="${sub.id}">${esc(t(L, 'btn_enter'))}</button>`;
      }
    }
    const timeLine = makeupMode
      ? esc(tFmt(L, 'makeup_label', { min }))
      : `${fmtTime(sub.start_at, L)} – ${fmtTime(sub.end_at, L)}`;
    return `<div class="sub-row${makeupMode ? ' sub-makeup' : ''}">
      <div>
        <div style="font-weight:700">${esc(subTitle)}${makeupMode ? ` <span class="tag tag-open" style="font-size:11px;margin-left:6px">${esc(t(L, 'makeup_short'))}</span>` : ''}</div>

      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <span class="tag ${tagCls}">${esc(tagTxt)}</span>${btn}

  }).join('');
  const allMakeupDone = makeupMode && queue.length > 0 && queue.every((s) => s.attempt_status === 'submitted');
  return `<div class="card">
    <h2>${esc(t(L, makeupMode ? 'schedule_makeup_title' : 'schedule_title'))}</h2>

function ensureFillBlankInputs(root) {
  if (!root) return;
  const qs = S.paper?.questions || [];
  root.querySelectorAll('.q-card').forEach((card) => {
    if (card.querySelector('.fill-table, .fill-blanks.labeled, .fill-inline-stem')) return;
    const qid = card.dataset.qid;
    const q = qs.find((x) => x.group_id === qid);
    if (!q || q.type !== 'fill') return;
    const stemEl = card.querySelector('.q-stem');
    const stem = stemEl?.textContent || q?.stem || '';
    const need = fillBlankCount(q || {}, stem, examContentLang(S.checkIn, S.paper));
    if (need <= 1) return;
    const body = card.querySelector('.q-body');
    if (!body) return;
    const existing = body.querySelectorAll('[data-kind="fill"]');
    if (existing.length >= need) return;
    const gid = qid || existing[0]?.dataset.gid;
    if (!gid) return;
    const raw = S.answers[gid];
    const arr = Array.isArray(raw) ? raw : (raw != null && raw !== '' ? [String(raw)] : []);
    body.innerHTML = `<div class="fill-blanks">${Array.from({ length: need }, (_, i) =>
      `<input class="inp" data-gid="${esc(gid)}" data-kind="fill" data-blank="${i}" value="${esc(arr[i] || '')}" placeholder="${i + 1}">`
    ).join('')}</div>`;
  });
}

}

document.querySelectorAll('#lang-sw button').forEach((b) => {
  b.addEventListener('click', () => setLang(b.dataset.lang));
});

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden' && S.view === 'exam') saveDraft({ silent: true });
});
window.addEventListener('beforeunload', (e) => {
  if (isMakeupExamView()) {
    e.preventDefault();
    e.returnValue = '';
  }
});
window.addEventListener('pagehide', () => {
  if (S.view === 'exam') {
    const root = document.getElementById('exam-root');
    if (root) S.answers = collectAnswers(root);
    saveLocalDraft();
  }
});

setLang(S.uiLang);
loadToday();
</script>
</body>
</html>
