<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;background:#f4f5ff;color:#1e1e2e;font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{cursor:pointer;border:none;background:none;font:inherit;color:inherit}
input,textarea,select{font:inherit;color:inherit}
a{color:#4f46e5;text-decoration:none}a:hover{text-decoration:underline}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:#c5c8e0;border-radius:3px}

.page{background:linear-gradient(135deg,#eef2ff,#fff 50%,#f5f3ff);min-height:100vh}
.wrap{max-width:780px;margin:0 auto;padding:24px 16px 64px}

.header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}
.brand{display:flex;flex-direction:column;gap:2px}
.brand .title{font-size:18px;font-weight:800;color:#1e1e2e}
.brand .sub{font-size:12px;color:#6b7280}

.lang-switch{display:inline-flex;background:#fff;border:1px solid #e0e7ff;border-radius:10px;padding:3px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.lang-switch button{padding:6px 12px;border-radius:8px;font-size:12px;font-weight:600;color:#6b7280;transition:all .15s}
.lang-switch button.active{background:#4f46e5;color:#fff}

.card{background:#fff;border-radius:16px;border:1px solid #eef0ff;box-shadow:0 4px 14px rgba(31,38,135,.04);padding:24px;margin-bottom:18px}
.card h2{font-size:16px;font-weight:800;color:#1e1e2e;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid #f3f4f6;display:flex;align-items:center;gap:8px}
.card h2 .icon{font-size:18px}

.guide h3{font-size:14px;font-weight:800;color:#374151;margin-top:14px;margin-bottom:6px}
.guide h3:first-child{margin-top:0}
.guide p{color:#4b5563;margin-bottom:8px;white-space:pre-line}
.guide ul{padding-left:0;list-style:none;color:#4b5563}
.guide ul li{margin-bottom:4px}
.guide .note{margin-top:14px;padding:10px 12px;background:#fef9c3;border:1px solid #fde68a;border-radius:10px;color:#854d0e;font-size:12.5px;line-height:1.6}

.fld{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.fld label{font-size:13px;font-weight:600;color:#374151}
.fld label .req{color:#dc2626;margin-left:2px}
.fld .hint{font-size:11.5px;color:#9ca3af}
.inp,.sel,.textarea{border:1px solid #e5e7eb;border-radius:10px;padding:9px 12px;width:100%;background:#fff;outline:none;transition:border-color .15s,box-shadow .15s}
.inp:focus,.sel:focus,.textarea:focus{border-color:#818cf8;box-shadow:0 0 0 3px rgba(129,140,248,.18)}
.textarea{min-height:120px;resize:vertical;line-height:1.65;font-family:inherit}
.textarea.long{min-height:180px}
.count{font-size:11.5px;color:#9ca3af;text-align:right;margin-top:-2px}
.count.over{color:#dc2626;font-weight:600}

.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.grid-2{grid-template-columns:1fr}}

.radio-group,.checkbox-group{display:flex;flex-wrap:wrap;gap:8px}
.radio-pill{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border:1px solid #e5e7eb;border-radius:999px;background:#fff;cursor:pointer;transition:all .15s;font-size:13px;color:#374151;user-select:none}
.radio-pill:hover{border-color:#c7d2fe;background:#f5f3ff}
.radio-pill input{accent-color:#4f46e5;cursor:pointer}
.radio-pill.checked{border-color:#4f46e5;background:#eef2ff;color:#4338ca;font-weight:600}

.consent{display:flex;align-items:flex-start;gap:10px;padding:12px;border:1px solid #e0e7ff;background:#f5f3ff;border-radius:12px;cursor:pointer;line-height:1.55}
.consent input{margin-top:3px;accent-color:#4f46e5;cursor:pointer}
.consent span{font-size:13px;color:#4338ca}

.btn-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:12px;padding:12px 22px;font-weight:700;cursor:pointer;border:none;transition:all .15s}
.btn-primary{background:#4f46e5;color:#fff}
.btn-primary:hover{background:#4338ca;transform:translateY(-1px);box-shadow:0 4px 14px rgba(79,70,229,.3)}
.btn-primary:disabled{background:#c7d2fe;cursor:not-allowed;transform:none;box-shadow:none}
.btn-ghost{background:transparent;color:#6b7280;border:1px solid #e5e7eb;padding:8px 14px;font-weight:600;font-size:13px}
.btn-ghost:hover{background:#f9fafb;color:#374151}
.btn-outline{background:transparent;color:#4f46e5;border:1px solid #c7d2fe;padding:8px 14px;font-weight:600;font-size:13px}
.btn-outline:hover{background:#eef2ff}

.draft-status{font-size:11.5px;color:#9ca3af;display:inline-flex;align-items:center;gap:4px}
.draft-status.saved{color:#16a34a}

/* honeypot */
.hp-pot{position:absolute;left:-9999px;top:-9999px;opacity:0;pointer-events:none;height:0;width:0;overflow:hidden}

.spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;vertical-align:-3px}
@keyframes spin{to{transform:rotate(360deg)}}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1f2937;color:#fff;padding:11px 18px;border-radius:12px;font-size:13px;font-weight:500;z-index:200;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{background:#b91c1c}

.success-wrap{text-align:center;padding:18px 0}
.success-icon{font-size:48px;margin-bottom:8px}
.success-h{font-size:22px;font-weight:800;color:#15803d;margin-bottom:8px}
.success-p{color:#4b5563;margin-bottom:12px;line-height:1.7}
.appno-box{display:inline-block;background:#ecfdf5;border:2px solid #6ee7b7;border-radius:14px;padding:14px 22px;margin:8px 0 12px}
.appno-box .label{font-size:11px;color:#15803d;font-weight:700;letter-spacing:.4px;text-transform:uppercase;margin-bottom:4px}
.appno-box .no{font-family:ui-monospace,'SF Mono',monospace;font-size:20px;font-weight:800;color:#065f46;letter-spacing:.5px}
.next-p{font-size:12.5px;color:#6b7280;background:#f9fafb;padding:10px 14px;border-radius:10px;margin-top:6px;line-height:1.7;white-space:pre-line}

footer{text-align:center;color:#9ca3af;font-size:11.5px;margin-top:20px}
footer a{color:#9ca3af}

/* 截止日横幅 */
.deadline-banner{border-radius:14px;padding:14px 18px;margin-bottom:18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.deadline-banner.active{background:#fff7ed;border:1px solid #fb923c}
.deadline-banner.expired{background:#fef2f2;border:1px solid #fca5a5}
.deadline-banner .dl-icon{font-size:22px;flex-shrink:0}
.deadline-banner .dl-body{flex:1;min-width:0}
.deadline-banner .dl-title{font-size:13px;font-weight:700;color:#9a3412;margin-bottom:4px}
.deadline-banner.expired .dl-title{color:#b91c1c}
.deadline-banner .dl-date{font-size:12px;color:#c2410c;margin-bottom:6px}
.deadline-banner.expired .dl-date{color:#b91c1c}
.countdown{display:inline-flex;gap:6px;align-items:center;flex-wrap:wrap}
.cd-unit{display:inline-flex;flex-direction:column;align-items:center;background:#fff;border:1px solid #fed7aa;border-radius:8px;padding:4px 10px;min-width:44px}
.cd-num{font-size:18px;font-weight:800;color:#c2410c;line-height:1.2;font-variant-numeric:tabular-nums}
.cd-lab{font-size:9px;color:#9a3412;letter-spacing:.3px;text-transform:uppercase}
.deadline-banner.expired .cd-num{color:#b91c1c}
.deadline-banner.expired .cd-unit{border-color:#fca5a5}
.expired-msg{font-size:14px;font-weight:800;color:#b91c1c}
</style>

<body>
<div class="page">
  <div class="wrap" id="app-root">
    <!-- Header -->
    <div class="header">
      <div class="brand">
        <div class="title" id="ui-title">美村宣教学院 · 继续申请</div>
        <div class="sub" id="ui-subtitle">教牧领袖与宣教士课程 · 第二年 / 第三年报名</div>
      </div>
      <div class="lang-switch" id="lang-switch">
        <button data-lang="zh" class="active">中文</button>
        <button data-lang="id">ID</button>
        <button data-lang="en">EN</button>
      </div>
    </div>

    <!-- 截止日横幅 -->
    <div class="deadline-banner active" id="deadline-banner">
      <div class="dl-icon">⏰</div>
      <div class="dl-body">
        <div class="dl-title" id="dl-title">申请截止时间</div>
        <div class="dl-date" id="dl-date">2026年5月31日（周日）晚 12:00</div>
        <div class="countdown" id="countdown">
          <div class="cd-unit"><span class="cd-num" id="cd-d">--</span><span class="cd-lab" id="cd-d-lab">天</span></div>
          <div class="cd-unit"><span class="cd-num" id="cd-h">--</span><span class="cd-lab" id="cd-h-lab">时</span></div>
          <div class="cd-unit"><span class="cd-num" id="cd-m">--</span><span class="cd-lab" id="cd-m-lab">分</span></div>
          <div class="cd-unit"><span class="cd-num" id="cd-s">--</span><span class="cd-lab" id="cd-s-lab">秒</span></div>
        </div>
        <div class="expired-msg" id="expired-msg" style="display:none">🚫 申请已截止</div>
      </div>
    </div>

    <!-- 招生简章 -->
    <div class="card guide" id="guide-card">
      <h2><span class="icon">📖</span><span id="ui-read-guide">招生简章</span></h2>
      <h3 id="g-intro-h"></h3><p id="g-intro-p"></p>
      <h3 id="g-purpose-h"></h3><p id="g-purpose-p"></p>
      <h3 id="g-program-h"></h3><p id="g-program-p"></p>
      <h3 id="g-cond-h"></h3>
      <ul><li id="g-cond-l1"></li><li id="g-cond-l2"></li><li id="g-cond-l3"></li></ul>
      <h3 id="g-fee-h"></h3><p id="g-fee-p"></p>
      <div class="note" id="g-note"></div>
    </div>

    <!-- 申请表 -->
    <form class="card" id="form-card" autocomplete="off">
      <h2><span class="icon">📝</span><span id="ui-form">申请表</span></h2>

      <!-- honeypot -->
      <div class="hp-pot"><input type="text" id="hp" name="hp" tabindex="-1" autocomplete="off"></div>

      <!-- 申请方向 -->
      <div class="fld">
        <label id="lab-target_year">申请年级<span class="req">*</span></label>
        <div class="radio-group" id="g-target_year">
          <label class="radio-pill"><input type="radio" name="target_year" value="2"><span data-opt="year2">第二年</span></label>
          <label class="radio-pill"><input type="radio" name="target_year" value="3"><span data-opt="year3">第三年</span></label>
        </div>
      </div>
      <div class="fld">
        <label id="lab-class_lang">班级语言<span class="req">*</span></label>
        <div class="radio-group" id="g-class_lang">
          <label class="radio-pill"><input type="radio" name="class_lang" value="zh"><span data-opt="zh">中文</span></label>
          <label class="radio-pill"><input type="radio" name="class_lang" value="id"><span data-opt="id">Bahasa Indonesia</span></label>
          <label class="radio-pill"><input type="radio" name="class_lang" value="en"><span data-opt="en">English</span></label>
        </div>
      </div>

      <!-- 基础信息 -->
      <h2 style="margin-top:12px"><span class="icon">👤</span><span id="ui-sec-basic">基础信息</span></h2>

      <div class="grid-2">
        <div class="fld">
          <label id="lab-full_name">姓名<span class="req">*</span></label>
          <input class="inp" id="f-full_name" maxlength="120">
        </div>
        <div class="fld">
          <label id="lab-date_of_birth">出生年月</label>
          <input class="inp" id="f-date_of_birth" type="date">
        </div>
        <div class="fld">
          <label id="lab-gender">性别</label>
          <div class="radio-group" id="g-gender">
            <label class="radio-pill"><input type="radio" name="gender" value="male"><span data-opt="male">男</span></label>
            <label class="radio-pill"><input type="radio" name="gender" value="female"><span data-opt="female">女</span></label>
          </div>
        </div>
        <div class="fld">
          <label id="lab-conversion_time">信主时间</label>
          <input class="inp" id="f-conversion_time" placeholder="例如：2015 / 2020-03">
        </div>
        <div class="fld">
          <label id="lab-enrollment_time">入学时间</label>
          <input class="inp" id="f-enrollment_time" placeholder="例如：2025-09">
        </div>
        <div class="fld">
          <label id="lab-nationality">国家 / 籍贯</label>
          <input class="inp" id="f-nationality" maxlength="120">
        </div>
        <div class="fld">
          <label id="lab-education">学历</label>
          <input class="inp" id="f-education" maxlength="120">
        </div>
        <div class="fld">
          <label id="lab-email">邮箱</label>
          <input class="inp" id="f-email" type="email" inputmode="email" autocomplete="email" maxlength="160">
        </div>
        <div class="fld">
          <label id="lab-whatsapp">WhatsApp</label>
          <input class="inp" id="f-whatsapp" type="tel" inputmode="tel" placeholder="例如 +62 812 3456 7890" maxlength="40">
          <div class="hint" id="hint-contact">请至少填写「邮箱」或「WhatsApp」之一</div>
        </div>
      </div>

      <!-- 长文本 -->
      <h2 style="margin-top:12px"><span class="icon">✍️</span><span id="ui-sec-text">个人见证（每段建议 500 字左右）</span></h2>

      <div class="fld">
        <label id="lab-first_year_reflection">第一年学习的主要收获<span class="req">*</span></label>
        <textarea class="textarea long" id="f-first_year_reflection" maxlength="3000"></textarea>
        <div class="count" id="c-first_year_reflection"></div>
      </div>
      <div class="fld">
        <label id="lab-gospel_confession">福音认信<span class="req">*</span></label>
        <textarea class="textarea long" id="f-gospel_confession" maxlength="3000"></textarea>
        <div class="count" id="c-gospel_confession"></div>
      </div>
      <div class="fld">
        <label id="lab-calling_testimony">蒙召见证<span class="req">*</span></label>
        <textarea class="textarea long" id="f-calling_testimony" maxlength="3000"></textarea>
        <div class="count" id="c-calling_testimony"></div>
      </div>

      <!-- 同意条款 -->
      <label class="consent" style="margin-top:8px">
        <input type="checkbox" id="f-consent">
        <span id="lab-consent">我已阅读招生简章，理解学费与奖助学金政策，并确认所填内容真实。</span>
      </label>

      <div class="btn-row" style="margin-top:18px">
        <button type="button" id="btn-submit" class="btn btn-primary">
          <span id="btn-submit-text">提交申请</span>
        </button>
        <button type="button" id="btn-clear-draft" class="btn btn-ghost">清除本机草稿</button>
        <span class="draft-status" id="draft-status"></span>
      </div>
      <div style="margin-top:10px">
        <a href="apply-continuing-status.html" id="btn-go-status" style="font-size:13px;color:#4f46e5;display:inline-flex;align-items:center;gap:4px">
          <span id="btn-go-status-text">已提交申请，查询当前状态 →</span>
        </a>
      </div>
    </form>

    <!-- 成功页（默认隐藏） -->
    <div class="card" id="success-card" style="display:none">
      <div class="success-wrap">
        <div class="success-icon">✅</div>
        <div class="success-h" id="suc-h">提交成功</div>
        <div class="success-p" id="suc-p">请妥善保存以下申请编号：</div>
        <div class="appno-box">
          <div class="label">Application No.</div>
          <div class="no" id="suc-no">MMS-Y2-2026-0001</div>
        </div>
        <div class="next-p" id="suc-next"></div>
        <div class="btn-row" style="justify-content:center;margin-top:14px">
          <button type="button" id="btn-copy-no" class="btn btn-outline">复制申请编号</button>
          <a id="link-status" class="btn btn-primary" href="apply-continuing-status.html">查询申请状态</a>
          <button type="button" id="btn-new" class="btn btn-ghost">再填一份</button>
        </div>
      </div>
    </div>

    <footer>
      <a href="apply-continuing-status.html" id="link-status-foot">查询申请状态</a> · MMS Admissions
    </footer>
  </div>
</div>

<div class="toast" id="toast"></div>

  'use strict';

  // ─────────────── Supabase ───────────────
  var SUPABASE_URL = 'https://szjduusewnjxacrbbsdf.supabase.co';

      'lab-class_lang':            'field.class_lang',
      'lab-full_name':             'field.full_name',
      'lab-date_of_birth':         'field.date_of_birth',
      'lab-gender':                'field.gender',
      'lab-conversion_time':       'field.conversion_time',
      'lab-enrollment_time':       'field.enrollment_time',
      'lab-nationality':           'field.nationality',
      'lab-education':             'field.education',
      'lab-email':                 'field.email',
      'lab-whatsapp':              'field.whatsapp',
      'lab-first_year_reflection': 'field.first_year_reflection',
      'lab-gospel_confession':     'field.gospel_confession',
      'lab-calling_testimony':     'field.calling_testimony',
    };
    Object.keys(labMap).forEach(function (id) {
      var el = $(id); if (!el) return;
      var hadReq = el.querySelector('.req');
      el.textContent = T(labMap[id]);
      if (hadReq) {
        var r = document.createElement('span'); r.className = 'req'; r.textContent = '*';
        el.appendChild(r);
      }
    });
    setText('lab-consent', T('consent.label'));
    setText('hint-contact', T('err.contact'));
    setText('btn-submit-text', T('btn.submit'));
    var goStatusText = currentLang === 'id'
      ? 'Sudah mendaftar? Cek status →'
      : currentLang === 'en'
      ? 'Already applied? Check status →'
      : '已提交申请，查询当前状态 →';
    setText('btn-go-status-text', goStatusText);
    var clr = $('btn-clear-draft'); if (clr) clr.textContent = T('btn.draft_clear');

    // 选项文本
    document.querySelectorAll('[data-opt]').forEach(function (el) {
      var key = el.getAttribute('data-opt');
      el.textContent = T('opt.' + key);
    });

    // 成功页文案
    setText('suc-h', T('submit.success_h'));
    setText('suc-p', T('submit.success_p'));
    setText('suc-next', T('submit.next_p'));
    var btnCopy = $('btn-copy-no'); if (btnCopy) btnCopy.textContent = T('submit.copy');
    var btnNew  = $('btn-new'); if (btnNew) btnNew.textContent = T('submit.new');
    var linkSt  = $('link-status'); if (linkSt) linkSt.textContent = T('submit.go_status');
    var linkStF = $('link-status-foot'); if (linkStF) linkStF.textContent = T('app.status_query');

    refreshCounts();
    refreshLangButtons();
  }

  function refreshLangButtons() {
    document.querySelectorAll('#lang-switch button').forEach(function (b) {
      b.classList.toggle('active', b.getAttribute('data-lang') === currentLang);
    });
  }

  // ─────────────── 字数计数 ───────────────
  function refreshCounts() {
    var counts = {
      first_year_reflection: 3000,
      gospel_confession: 3000,
      calling_testimony: 3000,
    };
    Object.keys(counts).forEach(function (k) {
      var el = $('f-' + k);
      var c  = $('c-' + k);
      if (!el || !c) return;
      var v = (el.value || '');
      var n = v.length;
      var lim = counts[k];
      c.textContent = n + ' / ' + lim + ' ' + T('count.suffix');
      c.classList.toggle('over', n > lim);
    });
  }

  // ─────────────── Radio pill 视觉态 ───────────────
  function refreshRadioPills() {
    document.querySelectorAll('.radio-pill').forEach(function (lab) {
      var inp = lab.querySelector('input[type=radio]');
      if (!inp) return;
      lab.classList.toggle('checked', !!inp.checked);
    });
  }

  // ─────────────── 草稿 ───────────────
  var draftTimer = null;
  function gatherDraft() {
    var d = {};
    FIELDS_LONG.concat(FIELDS_TEXT).forEach(function (k) {
      var el = $('f-' + k); if (el) d[k] = el.value || '';
    });
    FIELDS_RADIO.forEach(function (k) {
      var sel = document.querySelector('input[name="' + k + '"]:checked');
      d[k] = sel ? sel.value : '';
    });
    d.consent = !!($('f-consent') && $('f-consent').checked);
    return d;
  }
  function loadDraft() {
    try {
      var raw = localStorage.getItem(DRAFT_KEY);
      if (!raw) return;
      var d = JSON.parse(raw);
      if (!d || typeof d !== 'object') return;
      FIELDS_LONG.concat(FIELDS_TEXT).forEach(function (k) {
        var el = $('f-' + k); if (el && typeof d[k] === 'string') el.value = d[k];
      });
      FIELDS_RADIO.forEach(function (k) {
        if (!d[k]) return;
        var inp = document.querySelector('input[name="' + k + '"][value="' + d[k] + '"]');
        if (inp) inp.checked = true;
      });
      if ($('f-consent')) $('f-consent').checked = !!d.consent;
      refreshCounts();
      refreshRadioPills();
    } catch (e) { console.warn('draft load', e); }
  }
  function saveDraftSoon() {
    if (draftTimer) clearTimeout(draftTimer);
    draftTimer = setTimeout(function () {
      try {
        localStorage.setItem(DRAFT_KEY, JSON.stringify(gatherDraft()));
        var s = $('draft-status'); if (s) {
          s.textContent = '✓ ' + T('btn.draft_save');
          s.classList.add('saved');
          setTimeout(function () { s.textContent = ''; s.classList.remove('saved'); }, 2000);
        }
      } catch (e) {}
    }, 800);
  }
  function clearDraft() {
    try { localStorage.removeItem(DRAFT_KEY); } catch (e) {}
  }

  // ─────────────── 提交 ───────────────
  function validateBeforeSubmit() {
    var d = gatherDraft();

    if (!d.target_year) { toast(T('err.invalid_year'), true); return null; }
    if (!d.class_lang)  { toast(T('err.invalid_lang'), true); return null; }
    if (!d.full_name || !String(d.full_name).trim()) {
      toast(T('err.required', { label: T('field.full_name') }), true); return null;
    }
    var hasEmail = String(d.email || '').trim().length > 0;
    var waDigits = String(d.whatsapp || '').replace(/\D/g, '');
    if (!hasEmail && waDigits.length < 4) {
      toast(T('err.contact'), true); return null;
    }
    if (!d.first_year_reflection || !String(d.first_year_reflection).trim()) {
      toast(T('err.required', { label: T('field.first_year_reflection') }), true); return null;
    }
    if (!d.gospel_confession || !String(d.gospel_confession).trim()) {
      toast(T('err.required', { label: T('field.gospel_confession') }), true); return null;
    }
    if (!d.calling_testimony || !String(d.calling_testimony).trim()) {
      toast(T('err.required', { label: T('field.calling_testimony') }), true); return null;
    }
    var over = ['first_year_reflection', 'gospel_confession', 'calling_testimony'].some(function (k) {
      return (d[k] || '').length > 3000;
    });
    if (over) { toast(T('err.too_long'), true); return null; }
    if (!d.consent) { toast(T('err.consent'), true); return null; }

    var hp = $('hp') ? $('hp').value : '';

    return {
      target_year:           Number(d.target_year),
      class_lang:            d.class_lang,
      ui_lang:               currentLang,
      full_name:             d.full_name.trim(),
      gender:                d.gender || null,
      date_of_birth:         d.date_of_birth || null,
      nationality:           d.nationality || null,
      email:                 hasEmail ? d.email.trim() : null,
      whatsapp:              d.whatsapp || null,
      education:             d.education || null,
      conversion_time:       d.conversion_time || null,
      enrollment_time:       d.enrollment_time || null,
      first_year_reflection: d.first_year_reflection.trim(),
      gospel_confession:     d.gospel_confession.trim(),
      calling_testimony:     d.calling_testimony.trim(),
      hp:                    hp || null,
    };
  }

  function setSubmitting(on) {
    submitting = !!on;
    var b = $('btn-submit');
    if (!b) return;
    b.disabled = !!on;
    $('btn-submit-text').innerHTML = on
      ? '<span class="spinner"></span> ' + T('btn.submitting')
      : T('btn.submit');
  }

  function showSuccess(no) {
    $('form-card').style.display = 'none';
    $('guide-card').style.display = 'none';
    var s = $('success-card');
    s.style.display = '';
    setText('suc-no', no || '—');
    window.scrollTo({ top: 0, behavior: 'smooth' });
    // 更新查询页链接附带申请编号
    try {
      var url = new URL(location.origin + '/apply-continuing-status.html');
      if (no) url.searchParams.set('no', no);
      url.searchParams.set('lang', currentLang);
      var a = $('link-status');
      if (a) a.setAttribute('href', url.pathname + url.search);
    } catch (e) {}
  }

  async function onSubmit() {
    if (submitting) return;
    var payload = validateBeforeSubmit();
    if (!payload) return;
    if (!sb) { toast(T('err.network'), true); return; }

    setSubmitting(true);
    try {
      var res = await sb.rpc('submit_continuing_application', { p_payload: payload });
      if (res.error) {
        console.warn('submit rpc error', res.error);
        toast(T('err.network') + ': ' + (res.error.message || ''), true);
        setSubmitting(false);
        return;
      }
      var d = res.data || {};
      if (!d.ok) {
        var code = d.error || '';
        var msg = T('err.network');
        if (code === 'duplicate_recent_submission') msg = T('err.duplicate');
        else if (code === 'contact_required') msg = T('err.contact');
        else if (code === 'long_text_too_long') msg = T('err.too_long');
        else if (code === 'full_name_required') msg = T('err.required', { label: T('field.full_name') });
        else if (code === 'target_year_required') msg = T('err.invalid_year');
        else if (code === 'class_lang_required') msg = T('err.invalid_lang');
        else if (code) msg = msg + ': ' + code;
        toast(msg, true);
        setSubmitting(false);
        return;
      }
      clearDraft();
      showSuccess(d.application_no);
    } catch (e) {
      console.warn('submit exception', e);
      toast(T('err.network'), true);
      setSubmitting(false);
    }
  }

  // ─────────────── Bind events ───────────────
  function bindEvents() {
    document.querySelectorAll('#lang-switch button').forEach(function (b) {
      b.addEventListener('click', function () {
        currentLang = b.getAttribute('data-lang');
        try { localStorage.setItem(LANG_KEY, currentLang); } catch (e) {}
        try {
          var url = new URL(location.href);
          url.searchParams.set('lang', currentLang);
          history.replaceState(null, '', url.pathname + url.search);
        } catch (e) {}
        applyI18n();
        updateDeadlineBanner();
      });
    });

    FIELDS_LONG.forEach(function (k) {
      var el = $('f-' + k);
      if (!el) return;
      el.addEventListener('input', function () { refreshCounts(); saveDraftSoon(); });
    });
    FIELDS_TEXT.forEach(function (k) {
      var el = $('f-' + k);
      if (!el) return;
      el.addEventListener('input', saveDraftSoon);
    });
    FIELDS_RADIO.forEach(function (k) {
      document.querySelectorAll('input[name="' + k + '"]').forEach(function (inp) {
        inp.addEventListener('change', function () { refreshRadioPills(); saveDraftSoon(); });
      });
    });
    var consent = $('f-consent'); if (consent) consent.addEventListener('change', saveDraftSoon);

    $('btn-submit').addEventListener('click', onSubmit);
    $('btn-clear-draft').addEventListener('click', function () {
      clearDraft();
      // 重置表单
      document.querySelectorAll('#form-card input, #form-card textarea').forEach(function (el) {
        if (el.id === 'hp') return;
        if (el.type === 'checkbox' || el.type === 'radio') el.checked = false;
        else el.value = '';
      });
      refreshCounts();
      refreshRadioPills();
      toast('✓');
    });

    $('btn-copy-no').addEventListener('click', function () {
      var s = $('suc-no').textContent || '';
      if (!s) return;
      var done = function () { toast(T('submit.copied')); };
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(s).then(done, function () {
            var ta = document.createElement('textarea'); ta.value = s; document.body.appendChild(ta);
            ta.select(); try { document.execCommand('copy'); } catch (e) {}
            document.body.removeChild(ta); done();
          });
        } else {
          var ta = document.createElement('textarea'); ta.value = s; document.body.appendChild(ta);
          ta.select(); try { document.execCommand('copy'); } catch (e) {}
          document.body.removeChild(ta); done();
        }
      } catch (e) {}
    });

    $('btn-new').addEventListener('click', function () {
      location.href = location.pathname + '?lang=' + currentLang;
    });
  }

  // ─────────────── 截止倒计时 ───────────────
  // 截止时间：2026-05-31 周日 23:59:59 (UTC+7)
  var DEADLINE = new Date('2026-05-31T23:59:59+07:00');

  var DEADLINE_I18N = {
    zh: { title: '申请截止时间', date: '2026年5月31日（周日）晚 12:00', expired: '🚫 申请已截止',
          d:'天', h:'时', m:'分', s:'秒' },
    id: { title: 'Batas waktu pendaftaran', date: 'Minggu, 31 Mei 2026, pukul 00:00', expired: '🚫 Pendaftaran telah ditutup',
          d:'hari', h:'jam', m:'mnt', s:'dtk' },
    en: { title: 'Application deadline', date: 'Sunday, May 31, 2026 at midnight', expired: '🚫 Applications are now closed',
          d:'days', h:'hrs', m:'min', s:'sec' },
  };

  function updateDeadlineBanner() {
    var lang = currentLang || 'zh';
    var i18n = DEADLINE_I18N[lang] || DEADLINE_I18N.zh;
    var banner  = $('deadline-banner');
    var now     = new Date();
    var diff    = DEADLINE - now;

    $('dl-title').textContent = i18n.title;
    $('dl-date').textContent  = i18n.date;
    $('cd-d-lab').textContent = i18n.d;
    $('cd-h-lab').textContent = i18n.h;
    $('cd-m-lab').textContent = i18n.m;
    $('cd-s-lab').textContent = i18n.s;

    if (diff <= 0) {
      banner.className = 'deadline-banner expired';
      $('countdown').style.display   = 'none';
      $('expired-msg').style.display = '';
      $('expired-msg').textContent   = i18n.expired;
      // 截止后锁定提交按钮
      var btnSubmit = $('btn-submit');
      if (btnSubmit) { btnSubmit.disabled = true; btnSubmit.title = i18n.expired; }
      return;
    }

    banner.className = 'deadline-banner active';
    $('countdown').style.display   = '';
    $('expired-msg').style.display = 'none';

    var totalSec = Math.floor(diff / 1000);
    var s = totalSec % 60;
    var m = Math.floor(totalSec / 60) % 60;
    var h = Math.floor(totalSec / 3600) % 24;
    var d = Math.floor(totalSec / 86400);

    function pad(n) { return n < 10 ? '0' + n : '' + n; }
    $('cd-d').textContent = d;
    $('cd-h').textContent = pad(h);
    $('cd-m').textContent = pad(m);
    $('cd-s').textContent = pad(s);
  }

  // ─────────────── Bootstrap ───────────────
  document.addEventListener('DOMContentLoaded', function () {
    applyI18n();
    loadDraft();
    bindEvents();
    updateDeadlineBanner();
    setInterval(updateDeadlineBanner, 1000);
  });
})();
</script>
</body>
</html>
