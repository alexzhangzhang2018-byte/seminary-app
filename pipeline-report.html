<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>美村宣教学院 · 招生进度看板</title>
<meta name="robots" content="noindex, nofollow">
<script src="/vendor/supabase.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#f4f5ff;color:#1e293b;font-size:14px;line-height:1.45}
.wrap{max-width:100%;margin:0 auto;padding:16px 14px 32px}
.hdr{margin-bottom:12px}
.hdr h1{font-size:18px;font-weight:800}
.hdr .sub{font-size:12px;color:#64748b;margin-top:4px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:12px}
.stat-card{background:#fff;border-radius:14px;border:1px solid #f3f4f6;padding:14px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.stat-val{font-size:28px;font-weight:800;line-height:1.1}
.stat-lbl{font-size:11px;color:#9ca3af;margin-top:4px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.sel{padding:8px 12px;border:1px solid #e2e8f0;border-radius:10px;background:#fff;font:inherit;min-width:140px}
.btn{padding:8px 14px;border-radius:10px;border:1px solid #c7d2fe;background:#fff;color:#4f46e5;font-weight:700;cursor:pointer;font-size:13px}
.cnt{font-size:12px;color:#64748b;margin-left:auto}
.board{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;-webkit-overflow-scrolling:touch}
.col{flex:0 0 168px;min-width:156px;background:#fff;border:1px solid #e2e8f0;border-radius:12px;display:flex;flex-direction:column;max-height:72vh}
.col-h{padding:8px 10px;font-weight:700;font-size:12px;color:#475569;background:#f8fafc;border-radius:12px 12px 0 0;border-bottom:1px solid #f1f5f9;display:flex;justify-content:space-between;gap:4px;align-items:baseline}
.col-n{background:#e2e8f0;color:#64748b;font-size:10px;font-weight:700;padding:1px 6px;border-radius:999px;flex-shrink:0}
.col-body{overflow-y:auto;flex:1}
.row{padding:7px 10px;border-bottom:1px solid #f8fafc}
.row:last-child{border-bottom:none}
.row .n{font-weight:600;font-size:12px;line-height:1.35;word-break:break-word}
.row .s{font-size:11px;margin-top:2px;color:#4f46e5;font-weight:700}
.row .s.none{color:#cbd5e1;font-weight:400}
.col-empty{padding:12px 8px;font-size:11px;color:#cbd5e1;text-align:center}
.err,.load{padding:24px;text-align:center}
.err{color:#b91c1c;background:#fef2f2;border:1px solid #fecaca;border-radius:12px}
.note{font-size:11px;color:#94a3b8;margin-top:10px;text-align:center}
@media(max-width:600px){.stats{grid-template-columns:repeat(2,1fr);gap:8px}.stat-card{padding:10px 6px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="hdr">
    <h1>🏫 招生进度看板</h1>
    <div class="sub" id="subline">按阶段横向查看 · 仅供内部老师</div>
  </div>
  <div id="root"><div class="load">加载中…</div></div>
  <p class="note">切换班级查看；每列下方为姓名与笔试分（无则显示 —）。</p>
</div>
<script>
(function () {
  const SUPABASE_URL = 'https://szjduusewnjxacrbbsdf.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN6amR1dXNld25qeGFjcmJic2RmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ4NjMxNjEsImV4cCI6MjA5MDQzOTE2MX0.7Cg_uOp2Q2wtKaZqVnYdMLvnZJEyh6GyE26xXb-UTBw';
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const STAGES = [
    { id: 'apply', label: '报名' },
    { id: 'exam', label: '笔试' },
    { id: 'interview', label: '面试' },
    { id: 'result', label: '预录取' },
    { id: 'materials', label: '资料' },
    { id: 'visa', label: '签证' },
    { id: 'complete', label: '完成' },
  ];
  const TRACKS = [
    { id: 'all', label: '全部' },
    { id: 'zh', label: '中文班' },
    { id: 'en', label: '英文班' },
    { id: 'id', label: '印尼语班' },
    { id: 'ai', label: 'AI项目' },
    { id: 'np', label: '尼泊尔' },
  ];

  let snapshot = null;
  let track = 'all';

  function esc(s) {
    return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function applicantTrack(ap) {
    const c = String(ap.campus_code || '').toLowerCase();
    if (c === 'np') return 'np';
    if (c === 'ai') return 'ai';
    return ['en', 'id'].includes(ap.exam_lang) ? ap.exam_lang : 'zh';
  }

  function filterApps(apps) {
    if (track === 'all') return apps;
    return apps.filter((a) => applicantTrack(a) === track);
  }

  function computeStats(list) {
    return [
      { label: '总申请人', value: list.length, color: '#4f46e5' },
      { label: '待笔试', value: list.filter((a) => a.stage === 'exam').length, color: '#2563eb' },
      { label: '待面试', value: list.filter((a) => a.stage === 'interview').length, color: '#7c3aed' },
      { label: '资料/签证', value: list.filter((a) => ['materials', 'visa', 'complete'].includes(a.stage)).length, color: '#16a34a' },
    ];
  }

  function renderStats(apps) {
    const stats = computeStats(filterApps(apps));
    return `<div class="stats" id="stats-row">${stats.map((s) =>
      `<div class="stat-card"><div class="stat-val" style="color:${s.color}">${s.value}</div><div class="stat-lbl">${esc(s.label)}</div></div>`
    ).join('')}</div>`;
  }

  function scoreHtml(ap) {
    if (ap.exam_score != null && ap.exam_score !== '') {
      return `<div class="s">${esc(ap.exam_score)} 分</div>`;
    }
    return '<div class="s none">—</div>';
  }

  function renderBoard(apps) {
    const list = filterApps(apps);
    if (!list.length) {
      return '<div class="col-empty" style="padding:24px">该分类下暂无申请人</div>';
    }
    return STAGES.map((st) => {
      const inStage = list
        .filter((a) => a.stage === st.id)
        .sort((a, b) => String(a.display_name).localeCompare(String(b.display_name), 'zh'));
      const body = inStage.length
        ? inStage.map((ap) => `<div class="row"><div class="n">${esc(ap.display_name)}</div>${scoreHtml(ap)}</div>`).join('')
        : '<div class="col-empty">—</div>';
      return `<div class="col">
        <div class="col-h"><span>${esc(st.label)}</span><span class="col-n">${inStage.length}</span></div>
        <div class="col-body">${body}</div>
      </div>`;
    }).join('');
  }

  function renderShell() {
    const apps = snapshot?.applicants || [];
    const at = snapshot?.generated_at ? new Date(snapshot.generated_at) : null;
    document.getElementById('subline').textContent = at
      ? `更新于 ${at.toLocaleString('zh-CN', { hour12: false })}`
      : '按阶段横向查看';

    document.getElementById('root').innerHTML = `
      ${renderStats(apps)}
      <div class="toolbar">
        <select class="sel" id="track-filter">${TRACKS.map((t) =>
          `<option value="${t.id}"${t.id === track ? ' selected' : ''}>${esc(t.label)}</option>`
        ).join('')}</select>
        <button class="btn" type="button" id="btn-refresh">刷新</button>
        <span class="cnt" id="list-cnt">共 ${filterApps(apps).length} 人</span>
      </div>
      <div class="board" id="board">${renderBoard(apps)}</div>`;

    document.getElementById('track-filter').onchange = (e) => {
      track = e.target.value;
      document.getElementById('stats-row').outerHTML = renderStats(apps);
      document.getElementById('board').innerHTML = renderBoard(apps);
      document.getElementById('list-cnt').textContent = `共 ${filterApps(apps).length} 人`;
    };
    document.getElementById('btn-refresh').onclick = load;
  }

  async function load() {
    const root = document.getElementById('root');
    root.innerHTML = '<div class="load">加载中…</div>';
    try {
      const { data, error } = await sb.rpc('pipeline_snapshot_public');
      if (error) throw error;
      if (!data?.ok) {
        root.innerHTML = '<div class="err">无法加载数据，请稍后重试或联系教务。</div>';
        return;
      }
      snapshot = data;
      renderShell();
    } catch (e) {
      root.innerHTML = `<div class="err">加载失败：${esc(e.message || e)}</div>`;
    }
  }

  load();
  setInterval(load, 120000);
})();
</script>
</body>
</html>
