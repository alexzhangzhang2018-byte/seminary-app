<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>美村宣教学院 · 招生进度看板</title>
<meta name="robots" content="noindex, nofollow">
<script src="/vendor/supabase.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#f4f5ff;color:#1e293b;font-size:14px;line-height:1.5}
.wrap{max-width:900px;margin:0 auto;padding:16px 14px 40px}
.hdr{margin-bottom:14px}
.hdr h1{font-size:18px;font-weight:800}
.hdr .sub{font-size:12px;color:#64748b;margin-top:4px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.sel{padding:8px 12px;border:1px solid #e2e8f0;border-radius:10px;background:#fff;font:inherit;min-width:140px}
.btn{padding:8px 14px;border-radius:10px;border:1px solid #c7d2fe;background:#fff;color:#4f46e5;font-weight:700;cursor:pointer;font-size:13px}
.btn:hover{background:#eef2ff}
.cnt{font-size:12px;color:#64748b;margin-left:auto}
.panel{background:#fff;border:1px solid #e2e8f0;border-radius:14px;overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid #f1f5f9}
th{font-size:11px;color:#64748b;font-weight:700;background:#f8fafc}
tr:last-child td{border-bottom:none}
.name{font-weight:600}
.stage{font-size:12px;color:#475569}
.score{color:#4f46e5;font-weight:700}
.muted{color:#94a3b8}
.empty{padding:32px;text-align:center;color:#94a3b8;font-size:13px}
.err,.load{padding:24px;text-align:center}
.err{color:#b91c1c;background:#fef2f2;border:1px solid #fecaca;border-radius:12px}
.note{font-size:11px;color:#94a3b8;margin-top:12px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <div class="hdr">
    <h1>🏫 招生进度看板</h1>
    <div class="sub" id="subline">只读列表 · 仅供内部老师查看</div>
  </div>
  <div id="root"><div class="load">加载中…</div></div>
  <p class="note">数据与招生工作台同步；切换分类或点「刷新」获取最新状态。</p>
</div>
<script>
(function () {
  const SUPABASE_URL = 'https://szjduusewnjxacrbbsdf.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN6amR1dXNld25qeGFjcmJic2RmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ4NjMxNjEsImV4cCI6MjA5MDQzOTE2MX0.7Cg_uOp2Q2wtKaZqVnYdMLvnZJEyh6GyE26xXb-UTBw';
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const STAGES = [
    { id: 'apply', label: '报名' },
    { id: 'exam', label: '笔试' },
    { id: 'interview', label: '面试' },
    { id: 'result', label: '预录取' },
    { id: 'materials', label: '上传资料' },
    { id: 'visa', label: '签证' },
    { id: 'complete', label: '完成' },
  ];
  const STAGE_LABEL = Object.fromEntries(STAGES.map((s) => [s.id, s.label]));
  const STAGE_ORDER = Object.fromEntries(STAGES.map((s, i) => [s.id, i + 1]));
  const TRACKS = [
    { id: 'all', label: '全部' },
    { id: 'zh', label: '中文班' },
    { id: 'en', label: '英文班' },
    { id: 'id', label: '印尼语班' },
    { id: 'ai', label: 'AI项目' },
    { id: 'np', label: '尼泊尔' },
  ];

  let snapshot = null;
  let track = 'all';

  function esc(s) {
    return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function applicantTrack(ap) {
    const c = String(ap.campus_code || '').toLowerCase();
    if (c === 'np') return 'np';
    if (c === 'ai') return 'ai';
    return ['en', 'id'].includes(ap.exam_lang) ? ap.exam_lang : 'zh';
  }

  function formatIv(slot) {
    if (!slot) return '—';
    const tn = slot.teacher_name ? ' · ' + slot.teacher_name : '';
    return `${slot.slot_date || ''} ${slot.slot_time || ''}${tn}`.trim() || '—';
  }

  function filterApps(apps) {
    if (track === 'all') return apps;
    return apps.filter((a) => applicantTrack(a) === track);
  }

  function sortApps(list) {
    return list.slice().sort((a, b) => {
      const oa = STAGE_ORDER[a.stage] ?? 99;
      const ob = STAGE_ORDER[b.stage] ?? 99;
      if (oa !== ob) return oa - ob;
      return String(a.display_name).localeCompare(String(b.display_name), 'zh');
    });
  }

  function renderTable(apps) {
    const list = sortApps(filterApps(apps));
    if (!list.length) {
      return '<div class="empty">该分类下暂无申请人</div>';
    }
    const rows = list.map((ap) => {
      const score = ap.exam_score != null ? `<span class="score">${ap.exam_score}</span>` : '<span class="muted">—</span>';
      const pl4 = ap.phone_last4 ? esc(ap.phone_last4) : '—';
      const iv = ap.interview_slot ? esc(formatIv(ap.interview_slot)) : '<span class="muted">—</span>';
      return `<tr>
        <td class="name">${esc(ap.display_name)}</td>
        <td class="stage">${esc(STAGE_LABEL[ap.stage] || ap.stage || '—')}</td>
        <td>${score}</td>
        <td style="font-size:12px">${iv}</td>
        <td class="muted">${pl4}</td>
      </tr>`;
    }).join('');
    return `<table>
      <thead><tr><th>姓名</th><th>阶段</th><th>笔试</th><th>面试预约</th><th>尾号</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
  }

  function renderShell() {
    const s = snapshot?.stats || {};
    const apps = snapshot?.applicants || [];
    const at = snapshot?.generated_at ? new Date(snapshot.generated_at) : null;
    const sub = at
      ? `更新于 ${at.toLocaleString('zh-CN', { hour12: false })}`
      : '只读列表';
    document.getElementById('subline').textContent = sub;

    const filtered = filterApps(apps);
    document.getElementById('root').innerHTML = `
      <div class="toolbar">
        <select class="sel" id="track-filter">${TRACKS.map((t) =>
          `<option value="${t.id}"${t.id === track ? ' selected' : ''}>${esc(t.label)}</option>`
        ).join('')}</select>
        <button class="btn" type="button" id="btn-refresh">刷新</button>
        <span class="cnt" id="list-cnt">共 ${filtered.length} 人</span>
      </div>
      <div class="panel">${renderTable(apps)}</div>`;

    document.getElementById('track-filter').onchange = (e) => {
      track = e.target.value;
      document.querySelector('.panel').innerHTML = renderTable(apps);
      document.getElementById('list-cnt').textContent = `共 ${filterApps(apps).length} 人`;
    };
    document.getElementById('btn-refresh').onclick = load;
  }

  async function load() {
    const root = document.getElementById('root');
    root.innerHTML = '<div class="load">加载中…</div>';
    try {
      const { data, error } = await sb.rpc('pipeline_snapshot_public');
      if (error) throw error;
      if (!data?.ok) {
        root.innerHTML = '<div class="err">无法加载数据，请稍后重试或联系教务。</div>';
        return;
      }
      snapshot = data;
      renderShell();
    } catch (e) {
      root.innerHTML = `<div class="err">加载失败：${esc(e.message || e)}</div>`;
    }
  }

  load();
  setInterval(load, 120000);
})();
</script>
</body>
</html>
