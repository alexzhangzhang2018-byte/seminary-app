<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>美村宣教学院 · 内部考试</title>
<script src="/vendor/supabase.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;background:#f4f5ff;color:#1e1e2e;font-size:15px;line-height:1.55}
button{cursor:pointer;border:none;background:none;font:inherit}
input,textarea,select{font:inherit;color:inherit}
a{color:#4f46e5}
.page{min-height:100vh;background:linear-gradient(135deg,#eef2ff,#fff 45%,#f5f3ff)}
.wrap{max-width:820px;margin:0 auto;padding:20px 16px 48px}
.hdr{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.hdr h1{font-size:17px;font-weight:800}
.lang-sw{display:inline-flex;background:#fff;border:1px solid #e0e7ff;border-radius:10px;padding:3px}
.lang-sw button{padding:6px 12px;border-radius:8px;font-size:12px;font-weight:600;color:#6b7280}
.lang-sw button.on{background:#4f46e5;color:#fff}
.card{background:#fff;border:1px solid #eef0ff;border-radius:16px;padding:22px;margin-bottom:16px;box-shadow:0 4px 14px rgba(31,38,135,.05)}
.card h2{font-size:16px;font-weight:800;margin-bottom:12px}
.hint{font-size:13px;color:#6b7280;margin-bottom:14px;line-height:1.65}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:#374151}
.inp,.sel,.textarea{width:100%;border:1px solid #e5e7eb;border-radius:10px;padding:10px 12px;background:#fff;outline:none}
.inp:focus,.sel:focus,.textarea:focus{border-color:#818cf8;box-shadow:0 0 0 3px rgba(129,140,248,.18)}
.textarea{min-height:120px;resize:vertical;line-height:1.65}
.textarea.essay-sm{min-height:150px}
.textarea.essay-md{min-height:240px}
.textarea.essay-xl{min-height:360px}
.textarea.essay-lg{min-height:420px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.grid2{grid-template-columns:1fr}}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{padding:8px 14px;border:1px solid #e5e7eb;border-radius:999px;font-size:13px;cursor:pointer}
.pill.on{border-color:#4f46e5;background:#eef2ff;color:#4338ca;font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:12px;padding:12px 20px;font-weight:700;border:none;cursor:pointer}
.btn-p{background:#4f46e5;color:#fff}
.btn-p:hover{background:#4338ca}
.btn-p:disabled{background:#c7d2fe;cursor:not-allowed}
.btn-o{background:#fff;color:#4f46e5;border:1px solid #c7d2fe}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.sub-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 0;border-bottom:1px solid #f3f4f6}
.sub-row:last-child{border-bottom:none}
.tag{font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px}
.tag-up{background:#f1f5f9;color:#475569}
.tag-open{background:#dcfce7;color:#15803d}
.tag-end{background:#fee2e2;color:#dc2626}
.timer-bar{position:sticky;top:0;z-index:10;background:#eef2ff;border-bottom:1px solid #e0e7ff;padding:10px 16px;display:flex;align-items:center;gap:12px}
.timer-bar .t{font-weight:800;font-variant-numeric:tabular-nums;color:#4338ca}
.timer-track{flex:1;height:8px;background:#e5e7eb;border-radius:999px;overflow:hidden}
.timer-fill{height:100%;background:linear-gradient(90deg,#4f46e5,#818cf8);transition:width 1s linear}
.sec-head{margin:22px 0 12px;padding:12px 14px;border-radius:10px;font-size:15px;font-weight:800;color:#1e293b;background:#f1f5f9;border-left:4px solid #64748b}
.sec-head.sec-short{background:#eff6ff;border-left-color:#3b82f6;color:#1d4ed8}
.sec-head.sec-long{background:#faf5ff;border-left-color:#7c3aed;color:#5b21b6}
.q-card{border:1px solid #f3f4f6;border-radius:12px;padding:16px;margin-bottom:14px}
.q-card.essay-short{border-color:#dbeafe}
.q-card.essay-long{border-color:#e9d5ff}
.q-head{display:flex;justify-content:space-between;margin-bottom:8px}
.q-no{font-weight:800;color:#4f46e5}
.q-score{font-size:12px;color:#6b7280}
.q-stem{font-size:16px;line-height:1.7;margin-bottom:12px;white-space:pre-wrap}
.essay-wrap .essay-count{font-size:12px;color:#6b7280;margin-top:10px;text-align:right;font-variant-numeric:tabular-nums;line-height:1.5}
.essay-wrap .essay-count .essay-count-n{font-weight:700;color:#374151}
.essay-wrap .essay-count .essay-count-req{font-weight:600}
.essay-wrap .essay-count .essay-count-tip{display:inline-block;margin-right:6px;padding:2px 8px;border-radius:6px;background:#ffedd5;color:#c2410c;font-weight:700;font-size:11px}
.essay-wrap .essay-count.essay-count-low{color:#9a3412}
.essay-wrap .essay-count.essay-count-low .essay-count-n{color:#c2410c}
.essay-wrap .essay-count.essay-count-low .essay-count-req{display:inline-block;padding:2px 8px;border-radius:6px;background:#ffedd5;color:#c2410c;font-weight:800}
.essay-wrap .essay-count.essay-count-ok{color:#15803d;font-weight:600}
.essay-wrap .essay-count.essay-count-ok .essay-count-n{color:#15803d}
.essay-wrap .essay-count.essay-count-ok .essay-count-req{color:#15803d}
.opt{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border:1px solid #e5e7eb;border-radius:10px;margin-bottom:8px;cursor:pointer}
.opt input{margin-top:3px}
.cover-grid{display:grid;gap:10px;margin:14px 0}
.cover-line{display:flex;gap:8px;font-size:15px}
.cover-line strong{min-width:72px;color:#6b7280}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1f2937;color:#fff;padding:10px 16px;border-radius:12px;font-size:13px;opacity:0;transition:opacity .2s;z-index:99;max-width:92vw;text-align:center}
.toast.show{opacity:1}
.toast.err{background:#b91c1c}
.ok-center{text-align:center;padding:28px 12px}
.ok-center .ico{font-size:48px;margin-bottom:8px}
.ok-center h2{color:#15803d;font-size:20px;margin-bottom:8px}
</style>
</head>
<body>
<div class="page">
  <div class="wrap">
    <div class="hdr">
      <h1 id="site-title">美村宣教学院 · 内部考试</h1>
      <div class="lang-sw" id="lang-sw">
        <button data-lang="zh" class="on">中文</button>
        <button data-lang="en">EN</button>
        <button data-lang="id">ID</button>
      </div>
    </div>
    <div id="app"></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script type="module">
import {
  createSb, SESSION_KEY, LANG_KEY, t, esc, fmtTime, fmtTimer,
  gradeLabel, trackLabel, classTrackOptions, examLangForTrack,
  resolvePaperDisplayTitle, examContentLang,
  renderExamWithSections, collectAnswers, installProctor, installEssayCounters,
  isCoverConfirmed, setCoverConfirmed, clearCoverConfirmed,
} from './shared.js';

const sb = createSb();
const S = {
  uiLang: localStorage.getItem(LANG_KEY) || 'zh',
  token: localStorage.getItem(SESSION_KEY) || null,
  examDay: null,
  checkIn: null,
  schedule: [],
  view: 'loading',
  subject: null,
  paper: null,
  attempt: null,
  answers: {},
  proctorFlags: 0,
  timerSec: 0,
  timerTotal: 0,
  timerWarn10m: false,
  editingCheckIn: false,
  submitting: false,
};

let timerIv = null;
let draftIv = null;

function toast(msg, ok = true) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show' + (ok ? '' : ' err');
  setTimeout(() => el.classList.remove('show'), 2800);
}

function setLang(lang) {
  S.uiLang = lang;
  localStorage.setItem(LANG_KEY, lang);
  document.querySelectorAll('#lang-sw button').forEach((b) => {
    b.classList.toggle('on', b.dataset.lang === lang);
  });
  document.getElementById('site-title').textContent = t(lang, 'site');
  render();
}

async function loadToday() {
  if (!sb) { toast('Database unavailable', false); return; }
  const { data, error } = await sb.rpc('student_exam_get_today');
  if (error || !data?.ok) {
    S.examDay = null;
    S.view = 'no_exam';
    return;
  }
  S.examDay = data.exam_day;
  if (S.token) {
    const sch = await sb.rpc('student_exam_get_schedule', { p_token: S.token });
    if (sch.data?.ok) {
      S.checkIn = sch.data.check_in;
      S.schedule = sch.data.subjects || [];
      S.view = 'schedule';
      return;
    }
    S.token = null;
    localStorage.removeItem(SESSION_KEY);
  }
  S.view = 'checkin';
}

function getCheckInTrack() {
  return document.querySelector('input[name="f-track"]:checked')?.value || 'zh';
}

function canEditCheckIn() {
  return !(S.schedule || []).some((s) =>
    s.attempt_status === 'in_progress' || s.attempt_status === 'submitted'
  );
}

function rpcErrorText(code) {
  const key = {
    check_in_locked: 'err_check_in_locked',
    phone_last4_required: 'phone_last4',
    window_closed: 'err_window_closed',
    submit_failed: 'err_submit_fail',
    not_found: 'err',
  }[code];
  return key ? t(S.uiLang, key) : code;
}

function isNetworkError(err) {
  const m = String(err?.message || err || '').toLowerCase();
  return m.includes('fetch') || m.includes('network') || m.includes('timeout') || m.includes('failed to load');
}

async function rpcWithRetry(fn, payload, { tries = 5, delayMs = 2000 } = {}) {
  let lastErr = null;
  for (let i = 0; i < tries; i++) {
    try {
      const { data, error } = await sb.rpc(fn, payload);
      if (!error && data?.ok !== false) return { data, error: null };
      if (data?.ok === false && data?.error === 'already_submitted') return { data, error: null };
      if (data?.ok === false && !isNetworkError({ message: data?.error })) {
        return { data, error: error || { message: data?.error } };
      }
      lastErr = error || { message: data?.error || 'rpc_fail' };
    } catch (e) {
      lastErr = e;
    }
    if (i < tries - 1) {
      toast(t(S.uiLang, 'err_submit'), false);
      await new Promise((r) => setTimeout(r, delayMs * (i + 1)));
    }
  }
  return { data: null, error: lastErr };
}

function goEditCheckIn() {
  if (!canEditCheckIn()) {
    toast(t(S.uiLang, 'err_check_in_locked'), false);
    return;
  }
  S.editingCheckIn = true;
  S.view = 'checkin';
  render();
}

async function doCheckIn(resume = false) {
  const name = document.getElementById('f-name')?.value?.trim();
  const grade = +document.getElementById('f-grade')?.value;
  const classTrack = getCheckInTrack();
  const examLang = examLangForTrack(classTrack);
  const pl4 = document.getElementById('f-pl4')?.value?.trim() || null;
  if (!name) { toast(t(S.uiLang, 'full_name') + '?', false); return; }

  if (S.editingCheckIn && S.token && !resume) {
    if (!canEditCheckIn()) {
      toast(t(S.uiLang, 'err_check_in_locked'), false);
      S.editingCheckIn = false;
      S.view = 'schedule';
      render();
      return;
    }
    const { data, error } = await sb.rpc('student_exam_update_check_in', {
      p_token: S.token,
      p_full_name: name,
      p_grade: grade,
      p_class_track: classTrack,
      p_phone_last4: pl4,
      p_ui_lang: S.uiLang,
      p_exam_lang: examLang,
    });
    if (error || !data?.ok) {
      toast(rpcErrorText(data?.error) || t(S.uiLang, 'err'), false);
      return;
    }
    S.checkIn = data.check_in;
    clearCoverConfirmed();
    S.editingCheckIn = false;
    await refreshSchedule();
    toast(t(S.uiLang, 'checkin_saved'));
    return;
  }

  let rpc, args;
  if (resume && pl4) {
    rpc = 'student_exam_resume';
    args = { p_exam_day_id: S.examDay.id, p_full_name: name, p_grade: grade, p_phone_last4: pl4, p_class_track: classTrack };
  } else {
    rpc = 'student_exam_check_in';
    args = {
      p_exam_day_id: S.examDay.id,
      p_full_name: name,
      p_grade: grade,
      p_ui_lang: S.uiLang,
      p_exam_lang: examLang,
      p_phone_last4: pl4,
      p_resume_token: S.token || null,
      p_class_track: classTrack,
    };
  }

  const { data, error } = await sb.rpc(rpc, args);
  if (error || !data?.ok) {
    toast(rpcErrorText(data?.error) || t(S.uiLang, 'err'), false);
    return;
  }
  S.token = data.check_in.session_token;
  localStorage.setItem(SESSION_KEY, S.token);
  S.checkIn = data.check_in;
  if (!data.resumed) clearCoverConfirmed();
  S.editingCheckIn = false;
  await refreshSchedule();
}

async function refreshSchedule() {
  const { data } = await sb.rpc('student_exam_get_schedule', { p_token: S.token });
  if (data?.ok) {
    S.checkIn = data.check_in;
    S.schedule = data.subjects || [];
    S.view = 'schedule';
    render();
  }
}

async function openCover(subjectId) {
  const sub = S.schedule.find((x) => x.id === subjectId);
  if (!sub) return;
  if (sub.window_status === 'upcoming') { toast(t(S.uiLang, 'window_upcoming'), false); return; }
  if (sub.window_status === 'ended' && sub.attempt_status !== 'in_progress') {
    toast(t(S.uiLang, 'window_ended'), false);
    return;
  }
  if (sub.attempt_status === 'submitted') {
    S.view = 'done';
    S.subject = sub;
    render();
    return;
  }
  S.subject = sub;
  if (sub.attempt_status === 'in_progress' && sub.attempt_id) {
    await enterExam(sub, S.checkIn?.full_name);
    return;
  }
  if (isCoverConfirmed(S.examDay?.id, S.token)) {
    await enterExam(sub, S.checkIn?.full_name);
    return;
  }
  S.view = 'cover';
  render();
}

async function enterExam(sub, displayName) {
  const name = displayName?.trim();
  if (!name) return;
  const { data, error } = await sb.rpc('student_exam_start_attempt', {
    p_token: S.token,
    p_day_subject_id: sub.id,
    p_display_name: name,
  });
  if (error || !data?.ok) {
    toast(data?.error || t(S.uiLang, 'err'), false);
    return;
  }
  S.attempt = data.attempt;
  S.answers = S.attempt.answers_json || {};
  S.proctorFlags = S.attempt.proctor_flags || 0;
  const paperRes = await sb.rpc('student_exam_get_paper', { p_token: S.token, p_day_subject_id: sub.id });
  if (!paperRes.data?.ok) { toast(t(S.uiLang, 'err'), false); return; }
  S.paper = paperRes.data;
  S.subject = { ...sub, ...paperRes.data.subject };
  const endMs = new Date(S.subject.end_at).getTime();
  S.timerSec = Math.max(0, Math.floor((endMs - Date.now()) / 1000));
  S.timerTotal = S.timerSec;
  S.timerWarn10m = false;
  S.view = 'exam';
  render();
  startTimer();
  startDraftSave();
  installProctor(() => {
    if (S.view !== 'exam') return;
    S.proctorFlags++;
    toast(t(S.uiLang, 'proctor_warn'), false);
  });
}

async function confirmCoverAndStart() {
  const displayName = document.getElementById('cover-name')?.value?.trim();
  if (!displayName) return;
  setCoverConfirmed(S.examDay?.id, S.token);
  await enterExam(S.subject, displayName);
}

function startTimer() {
  clearInterval(timerIv);
  if (S.timerSec <= 600 && !S.timerWarn10m) {
    S.timerWarn10m = true;
    toast(t(S.uiLang, 'timer_10m'), false);
  }
  timerIv = setInterval(() => {
    S.timerSec--;
    const d = document.getElementById('timer-d');
    const f = document.getElementById('timer-fill');
    if (d) d.textContent = fmtTimer(S.timerSec);
    if (f && S.timerTotal) f.style.width = `${((S.timerTotal - S.timerSec) / S.timerTotal) * 100}%`;
    if (S.timerSec <= 600 && !S.timerWarn10m) {
      S.timerWarn10m = true;
      toast(t(S.uiLang, 'timer_10m'), false);
    }
    if (S.timerSec <= 0) submitExam('timeout');
  }, 1000);
}

function startDraftSave() {
  clearInterval(draftIv);
  draftIv = setInterval(saveDraft, 15000);
}

async function saveDraft() {
  if (!S.attempt?.id || S.view !== 'exam') return;
  const root = document.getElementById('exam-root');
  S.answers = collectAnswers(root);
  await sb.rpc('student_exam_save_draft', {
    p_token: S.token,
    p_attempt_id: S.attempt.id,
    p_answers: S.answers,
    p_proctor_flags: S.proctorFlags,
  });
}

async function submitExam(submitType = 'manual') {
  if (S.submitting) return;
  S.submitting = true;
  clearInterval(timerIv);
  clearInterval(draftIv);
  const root = document.getElementById('exam-root');
  S.answers = collectAnswers(root);
  const btn = document.getElementById('btn-submit');
  if (btn) { btn.disabled = true; btn.textContent = t(S.uiLang, 'err_submitting'); }
  toast(t(S.uiLang, 'err_submitting'), true);

  const { data, error } = await rpcWithRetry('student_exam_submit', {
    p_token: S.token,
    p_attempt_id: S.attempt.id,
    p_answers: S.answers,
    p_proctor_flags: S.proctorFlags,
    p_submit_type: submitType,
  }, { tries: submitType === 'timeout' ? 8 : 5, delayMs: 2500 });

  S.submitting = false;
  if (btn) { btn.disabled = false; btn.textContent = t(S.uiLang, 'submit'); }

  if (error || (!data?.ok && !data?.already)) {
    if (data?.error !== 'already_submitted') {
      const msg = data?.error
        ? rpcErrorText(data.error)
        : (isNetworkError(error) ? t(S.uiLang, 'err_submit_network') : t(S.uiLang, 'err_submit_fail'));
      toast(msg, false);
      startDraftSave();
      return;
    }
  }
  S.view = 'done';
  toast(t(S.uiLang, 'submitted_ok'));
  await refreshSchedule();
  render();
}

function renderCheckin() {
  const L = S.uiLang;
  const editing = S.editingCheckIn;
  return `<div class="card">
    <h2>${esc(t(L, 'checkin_title'))}</h2>
    <p class="hint">${esc(t(L, editing ? 'checkin_edit_hint' : 'checkin_hint'))}</p>
    <div class="fld"><label>${esc(t(L, 'full_name'))}</label>
      <input class="inp" id="f-name" value="${esc(S.checkIn?.full_name || '')}"></div>
    <div class="fld"><label>${esc(t(L, 'class_track'))}</label>
      <div class="pills" id="track-pills">
        ${classTrackOptions(L).map((o) => {
          const cur = S.checkIn?.class_track === 'zh_en' ? 'zh' : (S.checkIn?.class_track || 'zh');
          const on = o.v === cur;
          return `<label class="pill${on ? ' on' : ''}"><input type="radio" name="f-track" value="${o.v}"${on ? ' checked' : ''} style="display:none"> ${esc(o.l)}</label>`;
        }).join('')}
      </div></div>
    <div class="fld"><label>${esc(t(L, 'grade'))}</label>
      <select class="sel" id="f-grade">
        ${[1, 2, 3].map((g) => `<option value="${g}"${S.checkIn?.grade === g ? ' selected' : ''}>${esc(gradeLabel(g, L))}</option>`).join('')}
      </select></div>
    <div class="fld"><label>${esc(t(L, 'phone_last4'))}</label>
      <input class="inp" id="f-pl4" inputmode="numeric" maxlength="4" placeholder="1234" value="${esc(S.checkIn?.phone_last4 || '')}"></div>
    <div class="btn-row">
      <button class="btn btn-p" id="btn-checkin">${esc(t(L, editing ? 'btn_save_checkin' : 'btn_checkin'))}</button>
      ${editing
        ? `<button class="btn btn-o" id="btn-cancel-edit">${esc(t(L, 'btn_cancel_edit'))}</button>`
        : `<button class="btn btn-o" id="btn-resume">${esc(t(L, 'btn_resume'))}</button>`}
    </div>
  </div>`;
}

function renderSchedule() {
  const L = S.uiLang;
  const ci = S.checkIn;
  const examL = examLangForTrack(ci?.class_track);
  const rows = (S.schedule || []).map((sub) => {
    const subTitle = resolvePaperDisplayTitle({
      paper_title: sub.paper_display_title || sub.paper_title,
      title_locales: sub.title_locales,
      subject_name: sub.subject_name,
      course_code: sub.course_code,
      exam_lang: examL,
    }, examL);
    const ws = sub.window_status;
    const tagCls = ws === 'open' ? 'tag-open' : ws === 'ended' ? 'tag-end' : 'tag-up';
    const tagTxt = t(L, `window_${ws}`);
    let st = t(L, 'status_not_started');
    let btn = '';
    if (sub.attempt_status === 'submitted') {
      st = t(L, 'status_submitted');
      btn = `<button class="btn btn-o" disabled>${esc(t(L, 'btn_done'))}</button>`;
    } else if (sub.attempt_status === 'in_progress') {
      st = t(L, 'status_in_progress');
      btn = `<button class="btn btn-p" data-open="${sub.id}">${esc(t(L, 'btn_continue'))}</button>`;
    } else if (ws === 'open') {
      btn = `<button class="btn btn-p" data-open="${sub.id}">${esc(t(L, 'btn_enter'))}</button>`;
    }
    return `<div class="sub-row">
      <div>
        <div style="font-weight:700">${esc(subTitle)}</div>
        <div style="font-size:12px;color:#6b7280;margin-top:4px">${fmtTime(sub.start_at, L)} – ${fmtTime(sub.end_at, L)} · ${esc(st)}</div>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <span class="tag ${tagCls}">${esc(tagTxt)}</span>${btn}
      </div>
    </div>`;
  }).join('');
  return `<div class="card">
    <h2>${esc(t(L, 'schedule_title'))}</h2>
    <p class="hint">${esc(t(L, 'hello'))}，<strong>${esc(ci?.full_name)}</strong> · ${esc(gradeLabel(ci?.grade, L))} · ${esc(trackLabel(ci?.class_track, L))}</p>
    ${canEditCheckIn() ? `<div class="btn-row" style="margin-bottom:12px"><button class="btn btn-o" id="btn-edit-checkin">${esc(t(L, 'btn_edit_checkin'))}</button></div>` : ''}
    ${rows || '<p class="hint">—</p>'}
  </div>`;
}

function renderCover() {
  const L = S.uiLang;
  const sub = S.subject;
  const examL = examLangForTrack(S.checkIn?.class_track);
  const subTitle = resolvePaperDisplayTitle({
    paper_title: sub.paper_display_title || sub.paper_title,
    title_locales: sub.title_locales,
    subject_name: sub.subject_name,
    course_code: sub.course_code,
    exam_lang: examL,
  }, examL);
  return `<div class="card">
    <h2>${esc(t(L, 'cover_title'))}</h2>
    <p class="hint">${esc(t(L, 'cover_hint'))}</p>
    <div class="cover-grid">
      <div class="cover-line"><strong>${esc(t(L, 'cover_entering'))}</strong><span>${esc(subTitle)}</span></div>
      <div class="cover-line"><strong>${esc(t(L, 'grade'))}</strong><span>${esc(gradeLabel(S.checkIn?.grade, L))}</span></div>
      <div class="cover-line"><strong>${esc(t(L, 'class_track'))}</strong><span>${esc(trackLabel(S.checkIn?.class_track, L))}</span></div>
      <div class="cover-line"><strong>${esc(t(L, 'cover_name'))}</strong>
        <input class="inp" id="cover-name" value="${esc(S.checkIn?.full_name || '')}" style="flex:1"></div>
    </div>
    <button class="btn btn-p" id="btn-cover-start">${esc(t(L, 'cover_confirm'))}</button>
    <div class="btn-row"><button class="btn btn-o" id="btn-back-sched">${esc(t(L, 'back_schedule'))}</button></div>
  </div>`;
}

function renderExam() {
  const uiL = S.uiLang;
  const examL = examContentLang(S.checkIn, S.paper);
  const qs = S.paper?.questions || [];
  const html = renderExamWithSections(qs, S.answers, examL);
  const paperName = resolvePaperDisplayTitle({
    paper_title: S.paper?.paper_title,
    title_locales: S.paper?.title_locales,
    subject_name: S.subject?.subject_name,
    course_code: S.paper?.course_code || S.subject?.course_code,
    exam_lang: examL,
  }, examL);
  return `<div class="timer-bar">
    <span>${esc(t(uiL, 'timer'))}</span>
    <span class="t" id="timer-d">${fmtTimer(S.timerSec)}</span>
    <div class="timer-track"><div class="timer-fill" id="timer-fill" style="width:0%"></div></div>
    <button class="btn btn-p" id="btn-submit" style="padding:8px 14px">${esc(t(uiL, 'submit'))}</button>
  </div>
  <div class="card" style="margin-top:12px">
    <h2>${esc(paperName)}</h2>
    <div id="exam-root">${html}</div>
  </div>`;
}

function renderDone() {
  return `<div class="card ok-center">
    <div class="ico">✓</div>
    <h2>${esc(t(S.uiLang, 'submitted_ok'))}</h2>
    <div class="btn-row" style="justify-content:center;margin-top:16px">
      <button class="btn btn-p" id="btn-back-sched">${esc(t(S.uiLang, 'back_schedule'))}</button>
    </div>
  </div>`;
}

function render() {
  const app = document.getElementById('app');
  let html = '';
  if (S.view === 'loading') html = `<div class="card"><p>${esc(t(S.uiLang, 'loading'))}</p></div>`;
  else if (S.view === 'no_exam') html = `<div class="card"><p>${esc(t(S.uiLang, 'no_exam'))}</p></div>`;
  else if (S.view === 'checkin') html = renderCheckin();
  else if (S.view === 'schedule') html = renderSchedule();
  else if (S.view === 'cover') html = renderCover();
  else if (S.view === 'exam') html = renderExam();
  else if (S.view === 'done') html = renderDone();
  app.innerHTML = html;
  bind();
  if (S.view === 'exam') {
    installEssayCounters(document.getElementById('exam-root'), examContentLang(S.checkIn, S.paper));
  }
}

function bindTrackPills() {
  document.querySelectorAll('#track-pills .pill').forEach((pill) => {
    pill.addEventListener('click', () => {
      document.querySelectorAll('#track-pills .pill').forEach((p) => p.classList.remove('on'));
      pill.classList.add('on');
      const radio = pill.querySelector('input[type="radio"]');
      if (radio) radio.checked = true;
    });
  });
}

function bind() {
  bindTrackPills();
  document.getElementById('btn-checkin')?.addEventListener('click', () => doCheckIn(false));
  document.getElementById('btn-resume')?.addEventListener('click', () => doCheckIn(true));
  document.getElementById('btn-edit-checkin')?.addEventListener('click', goEditCheckIn);
  document.getElementById('btn-cancel-edit')?.addEventListener('click', () => {
    S.editingCheckIn = false;
    S.view = 'schedule';
    render();
  });
  document.querySelectorAll('[data-open]').forEach((el) => {
    el.addEventListener('click', () => openCover(el.dataset.open));
  });
  document.getElementById('btn-cover-start')?.addEventListener('click', confirmCoverAndStart);
  document.getElementById('btn-submit')?.addEventListener('click', () => submitExam('manual'));
  document.getElementById('btn-back-sched')?.addEventListener('click', async () => {
    clearInterval(timerIv);
    clearInterval(draftIv);
    S.view = 'schedule';
    await refreshSchedule();
  });
}

document.querySelectorAll('#lang-sw button').forEach((b) => {
  b.addEventListener('click', () => setLang(b.dataset.lang));
});

setLang(S.uiLang);
loadToday().then(render);
</script>
</body>
</html>
